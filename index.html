<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Beta Timer</title>

    <!-- PWA / iOS Meta Tags with Cache Busting -->
    <link rel="manifest" href="manifest.json?v=1.0.71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beta Timer">
    <link rel="apple-touch-icon" href="sailboat.jpg?v=1.0.71">

    <!-- Leaflet.js Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- HTML2Canvas Library for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
            --item-height: 50px;
        }

        /* Race Mode Theme */
        body.race-active {
            --bg-color: #ffffff;
            --card-bg: #f3f4f6;
            --text-color: #121214;
            --muted-color: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: calc(100vh - 16px);
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            min-height: 0;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Rolling Wheel Time Picker */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 10px;
            flex: 1;
            min-height: 130px;
            max-height: 170px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        .wheel {
            height: 100%;
            width: 100px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 12px;
            -webkit-overflow-scrolling: touch;
            scroll-padding-top: calc(50% - (var(--item-height) / 2));
            scroll-padding-bottom: calc(50% - (var(--item-height) / 2));
            padding-top: calc(50% - (var(--item-height) / 2));
            padding-bottom: calc(50% - (var(--item-height) / 2));
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: var(--item-height);
            min-height: var(--item-height);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            scroll-snap-align: center;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.15s, transform 0.15s;
        }

        .wheel-item.selected {
            opacity: 1.0;
            transform: scale(1.08);
        }

        .wheel-separator {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-color);
            padding-bottom: 8px;
        }

        .wheel-label {
            font-size: 0.65rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Target Time Input Container */
        .target-time-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 12px;
            flex: 1;
            min-height: 130px;
        }

        input[type="time"] {
            width: 80%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            background: rgba(128, 128, 128, 0.06);
            color: var(--text-color);
            font-size: 2.1rem;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .target-time-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        /* Active Countdown Display */
        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 14px;
            flex-shrink: 0;
            width: 100%;
        }

        .active-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active-value {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            line-height: 1;
        }

        .active-separator {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--muted-color);
            padding-bottom: 8px;
            line-height: 1;
        }

        .active-display.seconds-only {
            padding: 14px;
        }

        .active-display.seconds-only .active-value {
            font-size: 7.5rem;
            letter-spacing: -4px;
        }

        .active-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* GPS Track Map Panel */
        .right-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .gps-logger-panel {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 18px;
            padding: 8px;
            flex: 1;
            min-height: 160px;
        }

        .gps-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted-color);
            padding: 0 4px;
            flex-shrink: 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: 0.3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .gps-stats {
            font-size: 0.75rem;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.12);
            padding: 4px;
            border-radius: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        #map-wrapper {
            width: 100%;
            flex: 1;
            min-height: 100px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #map-container {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0f172a;
        }

        .download-btn {
            display: none;
            background-color: #059669;
            font-size: 0.85rem;
            padding: 8px;
            flex-shrink: 0;
        }

        .download-btn:hover {
            background-color: #047857;
        }

        .message {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--muted-color);
            min-height: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        /* Strict Default Hidden State for Standalone Timer Overlay */
        #standalone-timer-overlay {
            display: none !important;
        }

        /* LANDSCAPE ADAPTIVE RULES */
        @media (orientation: landscape) {
            html, body {
                height: 100vh !important;
                max-height: 100vh !important;
                width: 100vw !important;
                overflow: hidden !important;
                position: fixed !important;
            }

            body {
                padding: 4px !important;
                justify-content: center !important;
                align-items: center !important;
            }

            .container {
                max-width: 96vw;
                max-height: 96vh;
                height: 100%;
                margin: 0 auto;
                padding: 8px 14px;
            }

            .left-column {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                align-content: center;
            }

            .left-column > div:first-child {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2px;
            }

            .live-clock {
                margin-bottom: 0;
                font-size: 0.75rem;
            }

            h1 {
                font-size: 1rem;
                margin-bottom: 0;
            }

            .mode-tabs {
                width: 48%;
                margin-bottom: 2px;
                padding: 2px;
            }

            .tab-btn {
                padding: 5px;
                font-size: 0.8rem;
            }

            .picker-container, .target-time-container {
                width: 100%;
                min-height: 90px;
                max-height: 110px;
                margin-bottom: 2px;
                padding: 4px;
            }

            .wheel {
                width: 95px;
                max-height: 95px;
            }

            /* Natural fit sizing for pre-race active countdown display in landscape mode */
            .active-display {
                width: fit-content !important;
                margin: 0 auto 6px auto !important;
                padding: 10px 20px !important;
            }

            .message {
                width: 48%;
                margin-bottom: 0;
                font-size: 0.75rem;
                text-align: left;
            }

            .controls {
                width: 48%;
                flex-direction: row;
                gap: 6px;
            }

            .controls button {
                padding: 8px;
                font-size: 0.85rem;
                border-radius: 9px;
            }

            .right-column {
                display: none;
            }

            /* RACE MODE LANDSCAPE EDGE-TO-EDGE OVERRIDES */
            body.race-active.landscape-mode {
