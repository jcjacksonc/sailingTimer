<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countdown Timer</title>

    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Countdown">
    <link rel="apple-touch-icon" href="sailboat.jpg">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Rolling Wheel Container (Visible when stopped) */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel {
            height: 120px;
            width: 80px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--muted-color);
            scroll-snap-align: center;
            cursor: pointer;
            transition: color 0.15s;
        }

        .wheel-item.selected {
            color: var(--text-color);
        }

        .wheel-separator {
            font-size: 2rem;
            font-weight: 700;
            color: var(--muted-color);
            padding-bottom: 5px;
        }

        .wheel-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Active Countdown Display (Visible when running) */
        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 15px;
        }

        .active-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active-value {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .active-separator {
            font-size: 3rem;
            font-weight: 700;
            color: var(--muted-color);
            padding-bottom: 12px;
        }

        .active-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--muted-color);
            min-height: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
        <h1 id="event-title">Countdown Timer</h1>

        <!-- Rolling Wheel Time Picker (Shown when stopped) -->
        <div class="picker-container" id="picker-container">
            <div class="wheel-column">
                <div class="wheel" id="minutes-wheel"></div>
                <div class="wheel-label">Minutes</div>
            </div>
            <div class="wheel-separator">:</div>
            <div class="wheel-column">
                <div class="wheel" id="seconds-wheel"></div>
                <div class="wheel-label">Seconds</div>
            </div>
        </div>

        <!-- Clean Active Countdown Display (Shown when running) -->
        <div class="active-display" id="active-display">
            <div class="active-box">
                <div class="active-value" id="active-mins">00</div>
                <div class="active-label">Minutes</div>
            </div>
            <div class="active-separator">:</div>
            <div class="active-box">
                <div class="active-value" id="active-secs">00</div>
                <div class="active-label">Seconds</div>
            </div>
        </div>

        <div class="message" id="message">Scroll wheels to set time</div>

        <div class="controls">
            <button id="start-btn">Start Countdown</button>
            <button id="quick-5min-btn" class="btn-secondary">Quick 5 Min Timer</button>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const messageEl = document.getElementById('message');
        const pickerContainer = document.getElementById('picker-container');
        const activeDisplay = document.getElementById('active-display');
        const activeMinsEl = document.getElementById('active-mins');
        const activeSecsEl = document.getElementById('active-secs');
        const minutesWheel = document.getElementById('minutes-wheel');
        const secondsWheel = document.getElementById('seconds-wheel');
        const startBtn = document.getElementById('start-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');

        let targetTime = null;
        let isRunning = false;
        let lastSpokenSecond = -1;

        function populateWheel(wheelEl, maxVal) {
            wheelEl.innerHTML = '<div class="wheel-item" style="pointer-events:none;"></div>';
            for (let i = 0; i <= maxVal; i++) {
                const item = document.createElement('div');
                item.className = 'wheel-item';
                item.textContent = String(i).padStart(2, '0');
                item.dataset.value = i;
                item.addEventListener('click', () => {
                    if (!isRunning) wheelEl.scrollTop = i * 40;
                });
                wheelEl.appendChild(item);
            }
            wheelEl.innerHTML += '<div class="wheel-item" style="pointer-events:none;"></div>';
        }

        populateWheel(minutesWheel, 59);
        populateWheel(secondsWheel, 59);

        minutesWheel.scrollTop = 5 * 40;
        secondsWheel.scrollTop = 0 * 40;

        function getSelectedMinutes() {
            return Math.round(minutesWheel.scrollTop / 40);
        }

        function getSelectedSeconds() {
            return Math.round(secondsWheel.scrollTop / 40);
        }

        function setWheelValues(mins, secs) {
            minutesWheel.scrollTop = mins * 40;
            secondsWheel.scrollTop = secs * 40;
        }

        function updateWheelHighlight(wheelEl) {
            const index = Math.round(wheelEl.scrollTop / 40);
            const items = wheelEl.querySelectorAll('.wheel-item');
            items.forEach((item, idx) => {
                if (idx === index + 1) {
                    item.classList.add('selected');
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        minutesWheel.addEventListener('scroll', () => updateWheelHighlight(minutesView = minutesWheel));
        secondsWheel.addEventListener('scroll', () => updateWheelHighlight(secondsWheel));
        updateWheelHighlight(minutesWheel);
        updateWheelHighlight(secondsWheel);

        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `Current Time: ${now.toLocaleTimeString()}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function speak(text, forceCancel = false) {
            if ('speechSynthesis' in window) {
                if (forceCancel) window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            }
        }

        function setUIState(running) {
            if (running) {
                pickerContainer.style.display = 'none';
                activeDisplay.style.display = 'flex';
                quick5Btn.style.display = 'none';
                startBtn.textContent = "Reset / Stop";
            } else {
                pickerContainer.style.display = 'flex';
                activeDisplay.style.display = 'none';
                quick5Btn.style.display = 'block';
                startBtn.textContent = "Start Countdown";
            }
        }

        startBtn.addEventListener('click', () => {
            if (!isRunning) {
                const mins = getSelectedMinutes();
                const secs = getSelectedSeconds();
                const totalMs = (mins * 60 + secs) * 1000;

                if (totalMs <= 0) {
                    messageEl.textContent = "Please select a time > 0";
                    return;
                }

                targetTime = Date.now() + totalMs;
                isRunning = true;
                lastSpokenSecond = -1;
                messageEl.textContent = "Countdown running...";
                setUIState(true);
                speak("Timer started", true);
            } else {
                isRunning = false;
                targetTime = null;
                messageEl.textContent = "Timer stopped";
                setUIState(false);
                speak("Timer stopped", true);
            }
        });

        quick5Btn.addEventListener('click', () => {
            setWheelValues(5, 0);
            targetTime = Date.now() + 5 * 60 * 1000;
            isRunning = true;
            lastSpokenSecond = -1;
            messageEl.textContent = "5-minute timer started!";
            setUIState(true);
            speak("5 minute timer started", true);
        });

        function updateCountdown() {
            if (!isRunning || !targetTime) return;

            const now = Date.now();
            const distance = targetTime - now;
            const totalSeconds = Math.max(0, Math.floor(distance / 1000));

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            // Update the clean active text display
            activeMinsEl.textContent = String(minutes).padStart(2, '0');
            activeSecsEl.textContent = String(seconds).padStart(2, '0');
            setWheelValues(minutes, seconds); // keep background wheels in sync

            if (totalSeconds === 0 && distance <= 0) {
                isRunning = false;
                messageEl.textContent = "Time's up! 🎉";
                if (lastSpokenSecond !== 0) {
                    speak("Time is up!", true);
                    lastSpokenSecond = 0;
                }
                setUIState(false);
                return;
            }

            // Speech interval logic
            if (totalSeconds !== lastSpokenSecond) {
                let shouldSpeak = false;

                if (totalSeconds < 15) {
                    shouldSpeak = true;
                } else if (totalSeconds < 180) {
                    if (totalSeconds % 15 === 0) shouldSpeak = true;
                } else {
                    if (totalSeconds % 30 === 0) shouldSpeak = true;
                }

                if (shouldSpeak) {
                    let speechText = "";
                    if (totalSeconds < 15) {
                        speechText = String(totalSeconds);
                        speak(speechText, false);
                    } else {
                        if (minutes > 0 && seconds > 0) {
                            speechText = `${minutes} minutes ${seconds} seconds`;
                        } else if (minutes > 0) {
                            speechText = `${minutes} minutes`;
                        } else {
                            speechText = `${seconds} seconds`;
                        }
                        speak(speechText, true);
                    }
                }

                lastSpokenSecond = totalSeconds;
            }
        }

        setInterval(updateCountdown, 200);
    </script>
</body>
</html>
