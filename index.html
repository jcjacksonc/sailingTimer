<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Beta Timer</title>

    <!-- PWA / iOS Meta Tags with Cache Busting -->
    <link rel="manifest" href="manifest.json?v=1.0.71">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beta Timer">
    <link rel="apple-touch-icon" href="sailboat.jpg?v=1.0.71">

    <!-- Leaflet.js Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- HTML2Canvas Library for PNG Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
            --item-height: 50px;
        }

        /* Race Mode Theme */
        body.race-active {
            --bg-color: #ffffff;
            --card-bg: #f3f4f6;
            --text-color: #121214;
            --muted-color: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
        }

        html, body {
            height: 100vh;
            max-height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            max-height: calc(100vh - 16px);
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 14px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            min-height: 0;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 2px;
            font-variant-numeric: tabular-nums;
            font-weight: 500;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            font-weight: 700;
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 12px;
            padding: 3px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Rolling Wheel Time Picker */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 10px;
            flex: 1;
            min-height: 130px;
            max-height: 170px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        .wheel {
            height: 100%;
            width: 100px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 12px;
            -webkit-overflow-scrolling: touch;
            scroll-padding-top: calc(50% - (var(--item-height) / 2));
            scroll-padding-bottom: calc(50% - (var(--item-height) / 2));
            padding-top: calc(50% - (var(--item-height) / 2));
            padding-bottom: calc(50% - (var(--item-height) / 2));
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: var(--item-height);
            min-height: var(--item-height);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.2rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            scroll-snap-align: center;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.15s, transform 0.15s;
        }

        .wheel-item.selected {
            opacity: 1.0;
            transform: scale(1.08);
        }

        .wheel-separator {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-color);
            padding-bottom: 8px;
        }

        .wheel-label {
            font-size: 0.65rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 6px;
            font-weight: 600;
        }

        /* Target Time Input Container */
        .target-time-container {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 12px;
            flex: 1;
            min-height: 130px;
        }

        input[type="time"] {
            width: 80%;
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            background: rgba(128, 128, 128, 0.06);
            color: var(--text-color);
            font-size: 2.1rem;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .target-time-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            font-weight: 600;
        }

        /* Active Countdown Display */
        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 20px;
            padding: 14px;
            flex-shrink: 0;
            width: 100%;
        }

        .active-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active-value {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            line-height: 1;
        }

        .active-separator {
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--muted-color);
            padding-bottom: 8px;
            line-height: 1;
        }

        .active-display.seconds-only {
            padding: 14px;
        }

        .active-display.seconds-only .active-value {
            font-size: 7.5rem;
            letter-spacing: -4px;
        }

        .active-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 4px;
            font-weight: 600;
        }

        /* GPS Track Map Panel */
        .right-column {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .gps-logger-panel {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 18px;
            padding: 8px;
            flex: 1;
            min-height: 160px;
        }

        .gps-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted-color);
            padding: 0 4px;
            flex-shrink: 0;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: 0.3s;
            border-radius: 20px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--accent-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        .gps-stats {
            font-size: 0.75rem;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.12);
            padding: 4px;
            border-radius: 6px;
            text-align: center;
            flex-shrink: 0;
        }

        #map-wrapper {
            width: 100%;
            flex: 1;
            min-height: 100px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        #map-container {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #0f172a;
        }

        .download-btn {
            display: none;
            background-color: #059669;
            font-size: 0.85rem;
            padding: 8px;
            flex-shrink: 0;
        }

        .download-btn:hover {
            background-color: #047857;
        }

        .message {
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--muted-color);
            min-height: 16px;
            font-weight: 500;
            flex-shrink: 0;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }

        /* Strict Default Hidden State for Standalone Timer Overlay */
        #standalone-timer-overlay {
            display: none !important;
        }

        /* LANDSCAPE ADAPTIVE RULES */
        @media (orientation: landscape) {
            html, body {
                height: 100vh !important;
                max-height: 100vh !important;
                width: 100vw !important;
                overflow: hidden !important;
                position: fixed !important;
            }

            body {
                padding: 4px !important;
                justify-content: center !important;
                align-items: center !important;
            }

            .container {
                max-width: 96vw;
                max-height: 96vh;
                height: 100%;
                margin: 0 auto;
                padding: 8px 14px;
            }

            .left-column {
                flex-direction: row;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                align-content: center;
            }

            .left-column > div:first-child {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 2px;
            }

            .live-clock {
                margin-bottom: 0;
                font-size: 0.75rem;
            }

            h1 {
                font-size: 1rem;
                margin-bottom: 0;
            }

            .mode-tabs {
                width: 48%;
                margin-bottom: 2px;
                padding: 2px;
            }

            .tab-btn {
                padding: 5px;
                font-size: 0.8rem;
            }

            .picker-container, .target-time-container {
                width: 100%;
                min-height: 90px;
                max-height: 110px;
                margin-bottom: 2px;
                padding: 4px;
            }

            .wheel {
                width: 95px;
                max-height: 95px;
            }

            /* Natural fit sizing for pre-race active countdown display in landscape mode */
            .active-display {
                width: fit-content !important;
                margin: 0 auto 6px auto !important;
                padding: 10px 20px !important;
            }

            .message {
                width: 48%;
                margin-bottom: 0;
                font-size: 0.75rem;
                text-align: left;
            }

            .controls {
                width: 48%;
                flex-direction: row;
                gap: 6px;
            }

            .controls button {
                padding: 8px;
                font-size: 0.85rem;
                border-radius: 9px;
            }

            .right-column {
                display: none;
            }

            /* RACE MODE LANDSCAPE EDGE-TO-EDGE OVERRIDES */
            body.race-active.landscape-mode {
                padding: 0 !important;
                margin: 0 !important;
                width: 100vw !important;
                height: 100vh !important;
                overflow: hidden !important;
                position: fixed !important;
            }

            body.race-active.landscape-mode .container {
                display: block !important;
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                max-width: 100vw !important; max-height: 100vh !important;
                border-radius: 0 !important; padding: 0 !important;
                background: transparent !important;
                box-shadow: none !important;
            }

            body.race-active.landscape-mode .left-column {
                display: none !important;
            }

            body.race-active.landscape-mode .right-column {
                display: block !important;
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                z-index: 100;
            }

            body.race-active.landscape-mode .gps-logger-panel {
                display: block !important;
                position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                border-radius: 0 !important; border: none !important;
                background: #000 !important; padding: 0 !important; margin: 0 !important;
            }

            body.race-active.landscape-mode .gps-toggle-row { display: none !important; }

            body.race-active.landscape-mode #map-wrapper {
                position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                border-radius: 0 !important; margin: 0 !important; padding: 0 !important;
            }

            body.race-active.landscape-mode #map-container {
                width: 100vw !important; height: 100vh !important;
            }

            /* Only visible when race is active in landscape mode */
            body.race-active.landscape-mode #standalone-timer-overlay {
                display: flex !important;
                position: fixed !important;
                top: max(10px, env(safe-area-inset-top)) !important;
                left: max(16px, env(safe-area-inset-left)) !important;
                width: auto !important;
                max-width: max-content !important;
                background: rgba(0, 0, 0, 0.25) !important;
                backdrop-filter: blur(4px) !important;
                -webkit-backdrop-filter: blur(4px) !important;
                border: 1px solid rgba(255, 255, 255, 0.25) !important;
                border-radius: 12px !important;
                padding: 6px 14px !important;
                z-index: 999999 !important;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3) !important;
                align-items: center !important;
                gap: 8px !important;
            }

            body.race-active.landscape-mode #standalone-timer-overlay .active-box {
                display: flex !important;
                flex-direction: row !important;
            }

            body.race-active.landscape-mode #standalone-timer-overlay #box-sign,
            body.race-active.landscape-mode #standalone-timer-overlay .active-label {
                display: none !important;
            }

            body.race-active.landscape-mode #standalone-timer-overlay .active-value,
            body.race-active.landscape-mode #standalone-timer-overlay .active-separator {
                font-size: 2.8rem !important;
                line-height: 1 !important;
                color: #ffffff !important;
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
            }

            body.race-active.landscape-mode .gps-stats {
                position: fixed !important;
                bottom: max(10px, env(safe-area-inset-bottom)) !important; 
                left: max(16px, env(safe-area-inset-left)) !important;
                background: rgba(0, 0, 0, 0.25) !important;
                backdrop-filter: blur(4px) !important;
                -webkit-backdrop-filter: blur(4px) !important;
                color: #ffffff !important;
                padding: 6px 14px !important;
                border-radius: 12px !important;
                border: 1px solid rgba(255, 255, 255, 0.25) !important;
                font-size: 0.8rem !important;
                z-index: 999999 !important;
                font-weight: 700 !important;
                box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25) !important;
                text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
            }

            body.race-active.landscape-mode .download-btn {
                display: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- Hidden video element to prevent iOS display sleep in all modes -->
    <video id="wake-lock-video" playsinline loop muted style="display:none;">
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAptZGF0AAAAAA==" type="video/mp4">
    </video>

    <div id="standalone-timer-overlay" class="active-display"></div>

    <div class="container">
        <div class="left-column">
            <div>
                <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
                <h1 id="event-title">Beta Timer</h1>
            </div>

            <div class="mode-tabs" id="mode-tabs">
                <button class="tab-btn active" id="duration-tab">Duration</button>
                <button class="tab-btn" id="target-time-tab">Target Time</button>
            </div>

            <div class="picker-container" id="picker-container">
                <div class="wheel-column">
                    <div class="wheel" id="minutes-wheel"></div>
                    <div class="wheel-label">Minutes</div>
                </div>
                <div class="wheel-separator">:</div>
                <div class="wheel-column">
                    <div class="wheel" id="seconds-wheel"></div>
                    <div class="wheel-label">Seconds</div>
                </div>
            </div>

            <div class="target-time-container" id="target-time-container">
                <input type="time" id="time-input">
                <div class="target-time-label">Set Target Time (Hours : Minutes)</div>
            </div>

            <div class="active-display" id="active-display">
                <div class="active-box" id="box-sign" style="display:none;">
                    <div class="active-value" id="active-sign">&nbsp;</div>
                    <div class="active-label" id="active-mode-label">&nbsp;</div>
                </div>
                <div class="active-box" id="box-mins">
                    <div class="active-value" id="active-mins">05</div>
                    <div class="active-label">Minutes</div>
                </div>
                <div class="active-separator" id="box-sep">:</div>
                <div class="active-box" id="box-secs">
                    <div class="active-value" id="active-secs">00</div>
                    <div class="active-label">Seconds</div>
                </div>
            </div>

            <div class="message" id="message">Scroll wheels to set duration</div>

            <div class="controls">
                <button id="start-btn">Start Countdown</button>
                <button id="quick-5min-btn" class="btn-secondary">Quick 5 Min Timer</button>
            </div>
        </div>

        <div class="right-column">
            <div class="gps-logger-panel" id="gps-logger-panel">
                <div class="gps-toggle-row">
                    <span>Record Live GPS Track</span>
                    <label class="switch">
                        <input type="checkbox" id="gps-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="gps-stats" id="gps-stats">Awaiting GPS fix...</div>
                <div id="map-wrapper">
                    <div id="map-container"></div>
                </div>
                <button class="download-btn" id="download-track-btn">Download Track Map (PNG)</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            appTitle: "Beta Timer",
            startBtnText: "Start Countdown",
            stopBtnText: "Reset / Stop",
            quick5BtnText: "Quick 5 Min Timer",
            runningMsg: "Countdown running...",
            stoppedMsg: "Timer stopped",
            raceStartedMsg: "Race started! 🏁",
            timerStartedSpeech: "Timer started",
            timerStoppedSpeech: "Timer stopped",
            raceStartedSpeech: "Race started",
            defaultDurationMsg: "Scroll wheels to set duration",
            targetTimeMsg: "Set target hours and minutes",

            pipFreq: 440,
            pipDuration: 0.200,
            pipType: "sine",
            pipVolume: 2.0,

            doopFreq: 659.25,
            doopDuration: 0.75,
            doopType: "triangle",
            doopVolume: 2.0,

            speechRate: 1.0,        
            speechPitch: 1.0,       
            speechVoiceLang: "en-GB" 
        };

        const liveClockEl = document.getElementById('live-clock');
        const messageEl = document.getElementById('message');
        const eventTitleEl = document.getElementById('event-title');
        const modeTabs = document.getElementById('mode-tabs');
        const durationTab = document.getElementById('duration-tab');
        const targetTimeTab = document.getElementById('target-time-tab');
        const pickerContainer = document.getElementById('picker-container');
        const targetTimeContainer = document.getElementById('target-time-container');
        const timeInput = document.getElementById('time-input');
        const activeDisplay = document.getElementById('active-display');
        const standaloneTimerOverlay = document.getElementById('standalone-timer-overlay');
        const activeSignEl = document.getElementById('active-sign');
        const activeModeLabelEl = document.getElementById('active-mode-label');
        const activeMinsEl = document.getElementById('active-mins');
        const activeSecsEl = document.getElementById('active-secs');
        const boxSign = document.getElementById('box-sign');
        const boxMins = document.getElementById('box-mins');
        const boxSep = document.getElementById('box-sep');
        const boxSecs = document.getElementById('box-secs');
        const minutesWheel = document.getElementById('minutes-wheel');
        const secondsWheel = document.getElementById('seconds-wheel');
        const startBtn = document.getElementById('start-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');
        
        const gpsLoggerPanel = document.getElementById('gps-logger-panel');
        const gpsToggle = document.getElementById('gps-toggle');
        const gpsStats = document.getElementById('gps-stats');
        const downloadTrackBtn = document.getElementById('download-track-btn');
        const wakeVideo = document.getElementById('wake-lock-video');

        eventTitleEl.textContent = CONFIG.appTitle;
        startBtn.textContent = CONFIG.startBtnText;
        quick5Btn.textContent = CONFIG.quick5BtnText;
        messageEl.textContent = CONFIG.defaultDurationMsg;

        let targetTime = null;
        let isRunning = false;
        let lastSpokenSecond = -1;
        let hasPlayedRaceStart = false;
        let currentMode = 'duration';
        let audioCtx = null;
        let wakeLock = null;
        let cachedVoice = null;

        let watchId = null;
        let gpsTrackPoints = [];
        let isOvertimeActive = false;
        let leafletMap = null;
        let polylineGroup = null;
        let latestLat = null;
        let latestLon = null;
        let latestKnots = "0.0";
        let fortDenisonWindText = "Wind: Loading...";
        let windIntervalId = null;

        function getItemHeight() {
            return 50;
        }

        async function fetchFortDenisonWind() {
            // Fort Denison Station Observation Feed (Station ID 066022 / IDN60801.94768)
            const bomTarget = "https://reg.bom.gov.au/fwo/IDN60801/IDN60801.94768.json";
            
            // Primary CORS Proxy
            const primaryProxy = `https://corsproxy.io/?${encodeURIComponent(bomTarget)}`;
            // Fallback CORS Proxy
            const fallbackProxy = `https://api.allorigins.win/raw?url=${encodeURIComponent(bomTarget)}`;

            let obs = null;

            try {
                const res = await fetch(primaryProxy, { cache: "no-store" });
                if (res.ok) {
                    const json = await res.json();
                    obs = json?.observations?.data?.[0];
                }
            } catch (e) {
                console.log("Primary proxy failed, trying fallback...", e);
            }

            if (!obs) {
                try {
                    const resFb = await fetch(fallbackProxy, { cache: "no-store" });
                    if (resFb.ok) {
                        const jsonFb = await resFb.json();
                        obs = jsonFb?.observations?.data?.[0];
                    }
                } catch (e2) {
                    console.log("Fallback proxy failed:", e2);
                }
            }

            if (obs) {
                const dir = obs.wind_dir || "--";
                const kt = obs.wind_spd_kt !== undefined ? obs.wind_spd_kt : "--";
                const gust = obs.gust_kt !== undefined ? obs.gust_kt : "--";
                fortDenisonWindText = `Wind: ${dir} ${kt}kt (G ${gust})`;
            } else {
                fortDenisonWindText = "Wind: N/A";
            }
            updateTelemetryText();
        }

        function updateTelemetryText() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape && isOvertimeActive) {
                gpsStats.textContent = `SOG: ${latestKnots} kts | ${fortDenisonWindText}`;
            } else if (latestLat !== null && latestLon !== null) {
                gpsStats.textContent = `Lat: ${latestLat.toFixed(5)}, Lon: ${latestLon.toFixed(5)} | SOG: ${latestKnots} kts`;
            }
        }

        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape) {
                document.body.classList.add('landscape-mode');
            } else {
                document.body.classList.remove('landscape-mode');
            }

            if (isLandscape && isOvertimeActive) {
                if (standaloneTimerOverlay.children.length === 0) {
                    standaloneTimerOverlay.appendChild(boxSign);
                    standaloneTimerOverlay.appendChild(boxMins);
                    standaloneTimerOverlay.appendChild(boxSep);
                    standaloneTimerOverlay.appendChild(boxSecs);
                }
            } else {
                if (standaloneTimerOverlay.children.length > 0) {
                    activeDisplay.appendChild(boxSign);
                    activeDisplay.appendChild(boxMins);
                    activeDisplay.appendChild(boxSep);
                    activeDisplay.appendChild(boxSecs);
                }
            }

            updateTelemetryText();

            if (leafletMap) {
                setTimeout(() => leafletMap.invalidateSize(), 150);
            }
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                checkOrientation();
                setWheelValues(getSelectedMinutes() >= 0 ? getSelectedMinutes() : 5, getSelectedSeconds() >= 0 ? getSelectedSeconds() : 0);
            }, 300);
        });

        function initLeafletMap(lat, lon) {
            if (leafletMap) return;

            leafletMap = L.map('map-container', {
                zoomControl: false,
                attributionControl: false
            }).setView([lat, lon], 16);

            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 19,
                crossOrigin: true
            }).addTo(leafletMap);

            polylineGroup = L.layerGroup().addTo(leafletMap);

            setTimeout(() => {
                leafletMap.invalidateSize();
            }, 250);
        }

        function getSpeedColor(knots) {
            const k = parseFloat(knots);
            if (k < 3.0) return '#38bdf8';
            if (k < 6.0) return '#10b981';
            if (k < 8.0) return '#f59e0b';
            return '#ef4444';
        }

        function updateMapTrack() {
            if (!leafletMap || gpsTrackPoints.length === 0) return;

            polylineGroup.clearLayers();

            for (let i = 0; i < gpsTrackPoints.length - 1; i++) {
                const p1 = gpsTrackPoints[i];
                const p2 = gpsTrackPoints[i + 1];
                const segmentColor = getSpeedColor(p2.knots);

                L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], {
                    color: segmentColor,
                    weight: 6,
                    opacity: 0.95
                }).addTo(polylineGroup);
            }

            const latest = gpsTrackPoints[gpsTrackPoints.length - 1];
            leafletMap.setView([latest.lat, latest.lon]);
        }

        function startGPSTracking() {
            if ('geolocation' in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        if (!isOvertimeActive || !gpsToggle.checked) return;
                        latestLat = pos.coords.latitude;
                        latestLon = pos.coords.longitude;
                        const speedMs = pos.coords.speed;
                        latestKnots = speedMs ? (speedMs * 1.94384).toFixed(1) : '0.0';

                        gpsTrackPoints.push({ lat: latestLat, lon: latestLon, knots: latestKnots });
                        
                        updateTelemetryText();

                        if (!leafletMap) {
                            initLeafletMap(latestLat, latestLon);
                        } else {
                            leafletMap.invalidateSize();
                            updateMapTrack();
                        }
                    },
                    (err) => {
                        console.log("GPS error:", err);
                        gpsStats.textContent = "GPS signal unavailable";
                    },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            } else {
                gpsStats.textContent = "Geolocation not supported";
            }
        }

        function stopGPSTracking() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (leafletMap) {
                leafletMap.remove();
                leafletMap = null;
                polylineGroup = null;
            }
        }

        downloadTrackBtn.addEventListener('click', () => {
            const mapWrapper = document.getElementById('map-wrapper');
            html2canvas(mapWrapper, {
                useCORS: true,
                allowTaint: true,
                scale: 2
            }).then(canvas => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `beta-timer-track-${Date.now()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            });
        });

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
            if (wakeVideo) {
                wakeVideo.play().catch(() => {});
            }
        }

        async function releaseWakeLock() {
            if (wakeLock !== null) {
                try { await wakeLock.release(); wakeLock = null; } catch (err) {}
            }
            if (wakeVideo) {
                wakeVideo.pause();
            }
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && isRunning) {
                await requestWakeLock();
            }
        });

        function initAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, duration, type, volume) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function loadVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                cachedVoice = voices.find(v => v.lang.startsWith(CONFIG.speechVoiceLang)) || voices[0];
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoice;
            loadVoice();
        }

        function speak(text, forceCancel = false) {
            if (!('speechSynthesis' in window)) return;
            if (forceCancel) window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = CONFIG.speechRate;
            utterance.pitch = CONFIG.speechPitch;
            utterance.lang = CONFIG.speechVoiceLang;
            if (cachedVoice) utterance.voice = cachedVoice;
            window.speechSynthesis.speak(utterance);
        }

        function unlockSpeechAudio() {
            initAudioContext();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
                const dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
        }

        const defaultTarget = new Date(Date.now() + 5 * 60 * 1000);
        timeInput.value = `${String(defaultTarget.getHours()).padStart(2, '0')}:${String(defaultTarget.getMinutes()).padStart(2, '0')}`;

        durationTab.addEventListener('click', () => {
            if (isRunning) return;
            currentMode = 'duration';
            durationTab.classList.add('active');
            targetTimeTab.classList.remove('active');
            pickerContainer.style.display = 'flex';
            targetTimeContainer.style.display = 'none';
            quick5Btn.style.display = 'block';
            messageEl.textContent = CONFIG.defaultDurationMsg;
        });

        targetTimeTab.addEventListener('click', () => {
            if (isRunning) return;
            currentMode = 'target';
            targetTimeTab.classList.add('active');
            durationTab.classList.remove('active');
            pickerContainer.style.display = 'none';
            targetTimeContainer.style.display = 'flex';
            quick5Btn.style.display = 'none';
            messageEl.textContent = CONFIG.targetTimeMsg;
        });

        function populateWheel(wheelEl, maxVal) {
            let html = '';
            for (let i = 0; i <= maxVal; i++) {
                html += `<div class="wheel-item" data-value="${i}">${String(i).padStart(2, '0')}</div>`;
            }
            wheelEl.innerHTML = html;
            
            wheelEl.querySelectorAll('.wheel-item[data-value]').forEach(item => {
                item.addEventListener('click', () => {
                    if (!isRunning) {
                        const targetVal = parseInt(item.dataset.value, 10);
                        const itemH = getItemHeight();
                        wheelEl.scrollTo({ top: targetVal * itemH, behavior: 'smooth' });
                    }
                });
            });
        }

        function populateWheels() {
            populateWheel(minutesWheel, 59);
            populateWheel(secondsWheel, 59);
        }

        populateWheels();

        function getSelectedMinutes() { return Math.round(minutesWheel.scrollTop / getItemHeight()); }
        function getSelectedSeconds() { return Math.round(secondsWheel.scrollTop / getItemHeight()); }
        
        function setWheelValues(mins, secs) {
            const itemH = getItemHeight();
            minutesWheel.scrollTop = mins * itemH;
            secondsWheel.scrollTop = secs * itemH;
        }

        function updateWheelHighlight(wheelEl) {
            const itemH = getItemHeight();
            const selectedIdx = Math.round(wheelEl.scrollTop / itemH);
            wheelEl.querySelectorAll('.wheel-item[data-value]').forEach((item, idx) => {
                if (idx === selectedIdx) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        }

        minutesWheel.addEventListener('scroll', () => updateWheelHighlight(minutesWheel), { passive: true });
        secondsWheel.addEventListener('scroll', () => updateWheelHighlight(secondsWheel), { passive: true });

        function initWheelPositions() {
            setWheelValues(5, 0);
            updateWheelHighlight(minutesWheel);
            updateWheelHighlight(secondsWheel);
        }
        initWheelPositions();

        function haltWheelInertia() {
            setWheelValues(getSelectedMinutes(), getSelectedSeconds());
        }

        function updateLiveClock() {
            liveClockEl.textContent = `Current Time: ${new Date().toLocaleTimeString()}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function setUIState(running) {
            if (running) {
                modeTabs.style.display = 'none';
                pickerContainer.style.display = 'none';
                targetTimeContainer.style.display = 'none';
                activeDisplay.style.display = 'flex';
                quick5Btn.style.display = 'none';
                startBtn.textContent = CONFIG.stopBtnText;
            } else {
                document.body.classList.remove('race-active');
                modeTabs.style.display = 'flex';
                if (currentMode === 'duration') {
                    pickerContainer.style.display = 'flex';
                    quick5Btn.style.display = 'block';
                } else {
                    targetTimeContainer.style.display = 'flex';
                }
                activeDisplay.style.display = 'none';
                activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'none';
                boxMins.style.display = 'flex';
                boxSep.style.display = 'block';
                gpsLoggerPanel.style.display = 'none';
                isOvertimeActive = false;
                hasPlayedRaceStart = false;
                stopGPSTracking();
                gpsTrackPoints = [];
                latestLat = null;
                latestLon = null;
                if (windIntervalId) {
                    clearInterval(windIntervalId);
                    windIntervalId = null;
                }
                startBtn.textContent = CONFIG.startBtnText;
                checkOrientation();
                setTimeout(() => {
                    setWheelValues(5, 0);
                    updateWheelHighlight(minutesWheel);
                    updateWheelHighlight(secondsWheel);
                }, 50);
            }
        }

        startBtn.addEventListener('click', async () => {
            haltWheelInertia();
            unlockSpeechAudio();
            if (!isRunning) {
                let totalMs = 0;
                if (currentMode === 'duration') {
                    totalMs = (getSelectedMinutes() * 60 + getSelectedSeconds()) * 1000;
                } else {
                    const timeVal = timeInput.value;
                    if (!timeVal) { messageEl.textContent = "Please set a target time"; return; }
                    const [targetHours, targetMins] = timeVal.split(':').map(Number);
                    const now = new Date();
                    const targetDate = new Date();
                    targetDate.setHours(targetHours, targetMins, 0, 0);
                    if (targetDate.getTime() <= now.getTime()) targetDate.setDate(targetDate.getDate() + 1);
                    totalMs = targetDate.getTime() - now.getTime();
                }

                if (totalMs <= 0) { messageEl.textContent = "Target time must be in the future"; return; }

                targetTime = Date.now() + totalMs;
                isRunning = true;
                lastSpokenSecond = -1;
                hasPlayedRaceStart = false;
                messageEl.textContent = CONFIG.runningMsg;
                setUIState(true);
                await requestWakeLock();
                speak(CONFIG.timerStartedSpeech, true);
            } else {
                isRunning = false;
                targetTime = null;
                hasPlayedRaceStart = false;
                messageEl.textContent = CONFIG.stoppedMsg;
                setUIState(false);
                await releaseWakeLock();
                speak(CONFIG.timerStoppedSpeech, true);
            }
        });

        quick5Btn.addEventListener('click', async () => {
            haltWheelInertia();
            unlockSpeechAudio();
            currentMode = 'duration';
            durationTab.classList.add('active');
            targetTimeTab.classList.remove('active');
            pickerContainer.style.display = 'none';
            targetTimeContainer.style.display = 'none';
            
            setWheelValues(5, 0);
            updateWheelHighlight(minutesWheel);
            updateWheelHighlight(secondsWheel);

            targetTime = Date.now() + 5 * 60 * 1000;
            isRunning = true;
            lastSpokenSecond = -1;
            hasPlayedRaceStart = false;
            messageEl.textContent = CONFIG.runningMsg;
            setUIState(true);
            await requestWakeLock();
            speak(CONFIG.timerStartedSpeech, true);
        });

        function updateCountdown() {
            if (!isRunning || !targetTime) return;

            const distance = targetTime - Date.now();
            
            if (distance <= 0) {
                const elapsedMs = Math.abs(distance);
                const totalElapsedSeconds = Math.floor(elapsedMs / 1000);
                const minutes = Math.floor(totalElapsedSeconds / 60);
                const seconds = totalElapsedSeconds % 60;

                if (!isOvertimeActive) {
                    isOvertimeActive = true;
                    gpsLoggerPanel.style.display = 'flex';
                    downloadTrackBtn.style.display = 'block';
                    startGPSTracking();
                    fetchFortDenisonWind();
                    windIntervalId = setInterval(fetchFortDenisonWind, 5 * 60 * 1000); // refresh every 5 mins
                    checkOrientation();
                }

                activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'flex';
                boxMins.style.display = 'flex';
                boxSep.style.display = 'block';

                document.body.classList.add('race-active');

                activeSignEl.textContent = "+";
                activeModeLabelEl.textContent = "Overtime";
                activeMinsEl.textContent = String(minutes).padStart(2, '0');
                activeSecsEl.textContent = String(seconds).padStart(2, '0');
                messageEl.textContent = CONFIG.raceStartedMsg;

                if (!hasPlayedRaceStart) {
                    hasPlayedRaceStart = true;
                    playTone(CONFIG.doopFreq, CONFIG.doopDuration, CONFIG.doopType, CONFIG.doopVolume);
                    setTimeout(() => speak(CONFIG.raceStartedSpeech, true), 800);
                }
                return;
            }

            const totalSeconds = Math.ceil(distance / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            if (minutes === 0) {
                activeDisplay.classList.add('seconds-only');
                boxSign.style.display = 'none';
                boxMins.style.display = 'none';
                boxSep.style.display = 'none';
                activeSecsEl.textContent = String(seconds);
            } else {
                activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'none';
                boxMins.style.display = 'flex';
                boxSep.style.display = 'block';
                activeMinsEl.textContent = String(minutes).padStart(2, '0');
                activeSecsEl.textContent = String(seconds).padStart(2, '0');
            }

            setWheelValues(minutes, seconds);

            if (totalSeconds !== lastSpokenSecond) {
                if (totalSeconds === 15) {
                    speak("15", true);
                } else if (totalSeconds >= 11 && totalSeconds <= 20) {
                    playTone(CONFIG.pipFreq, CONFIG.pipDuration, CONFIG.pipType, CONFIG.pipVolume);
                } else if (totalSeconds >= 1 && totalSeconds <= 10) {
                    speak(String(totalSeconds), false);
                } else if (totalSeconds < 180 && totalSeconds % 15 === 0) {
                    speak(minutes > 0 ? `${minutes} minutes` : `${seconds} seconds`, true);
                } else if (totalSeconds >= 180 && totalSeconds % 30 === 0) {
                    speak(minutes > 0 ? `${minutes} minutes` : `${seconds} seconds`, true);
                }
                lastSpokenSecond = totalSeconds;
            }
        }

        setInterval(updateCountdown, 250);
        checkOrientation();
    </script>
</body>
</html>
