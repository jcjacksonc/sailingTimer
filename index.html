<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countdown Timer</title>

    <!-- PWA / iOS Meta Tags with Cache Busting -->
    <link rel="manifest" href="manifest.json?v=1.0.18">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Countdown">
    <link rel="apple-touch-icon" href="sailboat.jpg?v=1.0.18">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
        }

        /* Race Started Overtime Theme */
        body.race-active {
            --bg-color: #ffffff;
            --card-bg: #f3f4f6;
            --text-color: #121214;
            --muted-color: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 0.8rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Rolling Wheel Time Picker (Duration Mode) */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.15);
            border-radius: 20px;
            padding: 15px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel {
            height: 120px;
            width: 80px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            background: rgba(128, 128, 128, 0.05);
            border-radius: 12px;
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            scroll-snap-align: center;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.15s;
        }

        .wheel-item.selected {
            opacity: 1.0;
        }

        .wheel-separator {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-color);
            padding-bottom: 5px;
        }

        .wheel-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Target Time Input Container */
        .target-time-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.15);
            border-radius: 20px;
            padding: 25px 15px;
        }

        input[type="time"] {
            width: 80%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(128, 128, 128, 0.2);
            background: rgba(128, 128, 128, 0.05);
            color: var(--text-color);
            font-size: 1.5rem;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        .target-time-label {
            font-size: 0.75rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layline Map View Container */
        .map-view-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.15);
            border-radius: 20px;
            padding: 15px;
        }

        .map-wrapper {
            position: relative;
            width: 100%;
            height: 240px;
            border-radius: 16px;
            overflow: hidden;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .map-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
            filter: contrast(1.15) brightness(0.75);
        }

        canvas#tactical-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none; /* Allows pan/touch gestures to pass through to the map iframe */
        }

        .gps-info {
            font-size: 0.8rem;
            color: var(--muted-color);
            font-variant-numeric: tabular-nums;
        }

        /* Active Countdown Display (Visible when running) */
        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(128, 128, 128, 0.15);
            border-radius: 20px;
            padding: 25px 10px;
        }

        .active-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .active-separator {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--muted-color);
            padding-bottom: 12px;
        }

        .active-label {
            font-size: 0.65rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--muted-color);
            min-height: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
        <h1 id="event-title">Countdown Timer</h1>

        <!-- Mode Toggle Tabs -->
        <div class="mode-tabs" id="mode-tabs">
            <button class="tab-btn active" id="duration-tab">Duration</button>
            <button class="tab-btn" id="target-time-tab">Target Time</button>
            <button class="tab-btn" id="map-tab">Layline Map</button>
        </div>

        <!-- Rolling Wheel Time Picker (Duration Mode) -->
        <div class="picker-container" id="picker-container">
            <div class="wheel-column">
                <div class="wheel" id="minutes-wheel"></div>
                <div class="wheel-label">Minutes</div>
            </div>
            <div class="wheel-separator">:</div>
            <div class="wheel-column">
                <div class="wheel" id="seconds-wheel"></div>
                <div class="wheel-label">Seconds</div>
            </div>
        </div>

        <!-- Target Time Input (Target Time Mode) -->
        <div class="target-time-container" id="target-time-container">
            <input type="time" id="time-input">
            <div class="target-time-label">Set Target Time (Hours : Minutes)</div>
        </div>

        <!-- Layline Tactical Layered Map Container -->
        <div class="map-view-container" id="map-view-container">
            <div class="gps-info" id="gps-coords">Acquiring GPS fix...</div>
            <div class="map-wrapper">
                <!-- Layer 1: Underlying Sydney Harbour Map tile embed -->
                <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=151.18,-33.87,151.25,-33.83&layer=mapnik" loading="lazy"></iframe>
                <!-- Layer 2: Transparent Radar & Laylines Canvas Overlay -->
                <canvas id="tactical-canvas"></canvas>
            </div>
        </div>

        <!-- Clean Active Countdown Display (Shown when running) -->
        <div class="active-display" id="active-display">
            <div class="active-box">
                <div class="active-value" id="active-sign">&nbsp;</div>
                <div class="active-label">Mode</div>
            </div>
            <div class="active-box">
                <div class="active-value" id="active-mins">00</div>
                <div class="active-label">Minutes</div>
            </div>
            <div class="active-separator">:</div>
            <div class="active-box">
                <div class="active-value" id="active-secs">00</div>
                <div class="active-label">Seconds</div>
            </div>
        </div>

        <div class="message" id="message">Scroll wheels to set duration</div>

        <div class="controls">
            <button id="start-btn">Start Countdown</button>
            <button id="quick-5min-btn" class="btn-secondary">Quick 5 Min Timer</button>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURABLE TEXT STRINGS, AUDIO & VOICE
        // ==========================================
        const CONFIG = {
            appTitle: "Countdown Timer",
            startBtnText: "Start Countdown",
            stopBtnText: "Reset / Stop",
            quick5BtnText: "Quick 5 Min Timer",
            runningMsg: "Countdown running...",
            stoppedMsg: "Timer stopped",
            raceStartedMsg: "Race started! 🏁",
            timerStartedSpeech: "Timer started",
            timerStoppedSpeech: "Timer stopped",
            raceStartedSpeech: "Race started",
            defaultDurationMsg: "Scroll wheels to set duration",
            targetTimeMsg: "Set target hours and minutes",
            mapViewMsg: "Sydney Harbour Tactical Map ⛵",

            // Pip Tone Settings (20s - 11s)
            pipFreq: 440,          // A4 (440.00 Hz)
            pipDuration: 0.200,    // Duration in seconds
            pipType: "sine",       // Oscillator type
            pipVolume: 2.0,        // Gain volume

            // Doop Tone Settings (0s)
            doopFreq: 659.25,      // E5 (659.25 Hz)
            doopDuration: 0.75,    // Duration in seconds
            doopType: "triangle",  // Oscillator type
            doopVolume: 2.0,       // Gain volume

            // Speech Settings
            speechRate: 1.0,        
            speechPitch: 1.0,       
            speechVoiceLang: "en-GB" 
        };
        // ==========================================

        const liveClockEl = document.getElementById('live-clock');
        const messageEl = document.getElementById('message');
        const eventTitleEl = document.getElementById('event-title');
        const modeTabs = document.getElementById('mode-tabs');
        const durationTab = document.getElementById('duration-tab');
        const targetTimeTab = document.getElementById('target-time-tab');
        const mapTab = document.getElementById('map-tab');
        const pickerContainer = document.getElementById('picker-container');
        const targetTimeContainer = document.getElementById('target-time-container');
        const mapViewContainer = document.getElementById('map-view-container');
        const timeInput = document.getElementById('time-input');
        const activeDisplay = document.getElementById('active-display');
        const activeSignEl = document.getElementById('active-sign');
        const activeMinsEl = document.getElementById('active-mins');
        const activeSecsEl = document.getElementById('active-secs');
        const minutesWheel = document.getElementById('minutes-wheel');
        const secondsWheel = document.getElementById('seconds-wheel');
        const startBtn = document.getElementById('start-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');
        const gpsCoordsEl = document.getElementById('gps-coords');
        const tacticalCanvas = document.getElementById('tactical-canvas');
        const ctx = tacticalCanvas.getContext('2d');

        eventTitleEl.textContent = CONFIG.appTitle;
        startBtn.textContent = CONFIG.startBtnText;
        quick5Btn.textContent = CONFIG.quick5BtnText;
        messageEl.textContent = CONFIG.defaultDurationMsg;

        let targetTime = null;
        let isRunning = false;
        let lastSpokenSecond = -1;
        let currentMode = 'duration';
        let audioCtx = null;
        let wakeLock = null;
        let cachedVoice = null;
        let watchId = null;

        let currentLat = -33.8568;
        let currentLon = 151.2153;
        let currentKnots = 0.0;
        let currentHeading = 0;

        function resizeCanvas() {
            if (!tacticalCanvas) return;
            tacticalCanvas.width = tacticalCanvas.clientWidth * window.devicePixelRatio;
            tacticalCanvas.height = tacticalCanvas.clientHeight * window.devicePixelRatio;
            drawTacticalRadar();
        }
        window.addEventListener('resize', resizeCanvas);

        function drawTacticalRadar() {
            if (!ctx) return;
            const w = tacticalCanvas.width;
            const h = tacticalCanvas.height;
            const cx = w / 2;
            const cy = h / 2;

            ctx.clearRect(0, 0, w, h);

            // Radar Ring Backgrounds
            ctx.strokeStyle = "rgba(99, 102, 241, 0.35)";
            ctx.lineWidth = 2;

            [0.25, 0.45, 0.65].forEach(rRatio => {
                ctx.beginPath();
                ctx.arc(cx, cy, Math.min(w, h) * rRatio, 0, Math.PI * 2);
                ctx.stroke();
            });

            // Crosshairs
            ctx.beginPath();
            ctx.moveTo(cx, 10); ctx.lineTo(cx, h - 10);
            ctx.moveTo(10, cy); ctx.lineTo(w - 10, cy);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.15)";
            ctx.stroke();

            // Center Marker (Your Boat Position)
            ctx.fillStyle = "#4f46e5";
            ctx.beginPath();
            ctx.arc(cx, cy, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(cx, cy, 12, 0, Math.PI * 2);
            ctx.stroke();

            // North Arrow Indicator
            ctx.fillStyle = "#ef4444";
            ctx.font = "bold 14px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("N", cx, 24);
        }

        // Live GPS Tracking
        function startGPS() {
            if ('geolocation' in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (position) => {
                        currentLat = position.coords.latitude;
                        currentLon = position.coords.longitude;
                        const speedMs = position.coords.speed;
                        currentKnots = speedMs ? (speedMs * 1.94384).toFixed(1) : 0.0;
                        if (position.coords.heading) {
                            currentHeading = position.coords.heading;
                        }

                        gpsCoordsEl.textContent = `Lat: ${currentLat.toFixed(5)}, Lon: ${currentLon.toFixed(5)} | ${currentKnots} kts`;
                        drawTacticalRadar();
                    },
                    (error) => {
                        console.log("GPS error:", error);
                        gpsCoordsEl.textContent = "GPS signal unavailable";
                    },
                    {
                        enableHighAccuracy: true,
                        maximumAge: 1000,
                        timeout: 5000
                    }
                );
            } else {
                gpsCoordsEl.textContent = "Geolocation not supported";
            }
        }
        startGPS();

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration, type, volume) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function loadVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length > 0) {
                cachedVoice = voices.find(v => v.lang.startsWith(CONFIG.speechVoiceLang)) || voices[0];
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoice;
            loadVoice();
        }

        function speak(text, forceCancel = false) {
            if (!('speechSynthesis' in window)) return;
            if (forceCancel) window.speechSynthesis.cancel();
            
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = CONFIG.speechRate;
            utterance.pitch = CONFIG.speechPitch;
            utterance.lang = CONFIG.speechVoiceLang;
            if (cachedVoice) utterance.voice = cachedVoice;

            window.speechSynthesis.speak(utterance);
        }

        function unlockSpeechAudio() {
            initAudioContext();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
                const dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
        }

        const defaultTarget = new Date(Date.now() + 5 * 60 * 1000);
        timeInput.value = `${String(defaultTarget.getHours()).padStart(2, '0')}:${String(defaultTarget.getMinutes()).padStart(2, '0')}`;

        durationTab.addEventListener('click', () => {
            if (isRunning) return;
            currentMode = 'duration';
            durationTab.classList.add('active');
            targetTimeTab.classList.remove('active');
            mapTab.classList.remove('active');
            pickerContainer.style.display = 'flex';
            targetTimeContainer.style.display = 'none';
            mapViewContainer.style.display = 'none';
            quick5Btn.style.display = 'block';
            messageEl.textContent = CONFIG.defaultDurationMsg;
        });

        targetTimeTab.addEventListener('click', () => {
            if (isRunning) return;
            currentMode = 'target';
            targetTimeTab.classList.add('active');
            durationTab.classList.remove('active');
            mapTab.classList.remove('active');
            pickerContainer.style.display = 'none';
            targetTimeContainer.style.display = 'flex';
            mapViewContainer.style.display = 'none';
            quick5Btn.style.display = 'none';
            messageEl.textContent = CONFIG.targetTimeMsg;
        });

        mapTab.addEventListener('click', () => {
            if (isRunning) return;
            currentMode = 'map';
            mapTab.classList.add('active');
            durationTab.classList.remove('active');
            targetTimeTab.classList.remove('active');
            pickerContainer.style.display = 'none';
            targetTimeContainer.style.display = 'none';
            mapViewContainer.style.display = 'flex';
            quick5Btn.style.display = 'none';
            messageEl.textContent = CONFIG.mapViewMsg;
            setTimeout(resizeCanvas, 50);
        });

        function populateWheel(wheelEl, maxVal) {
            let html = '<div class="wheel-item" style="pointer-events:none;"></div>';
            for (let i = 0; i <= maxVal; i++) {
                html += `<div class="wheel-item" data-value="${i}">${String(i).padStart(2, '0')}</div>`;
            }
            html += '<div class="wheel-item" style="pointer-events:none;"></div>';
            wheelEl.innerHTML = html;

            wheelEl.querySelectorAll('.wheel-item[data-value]').forEach(item => {
                item.addEventListener('click', () => {
                    if (!isRunning) {
                        const val = parseInt(item.dataset.value);
                        wheelEl.scrollTop = val * 40;
                    }
                });
            });
        }

        populateWheel(minutesWheel, 59);
        populateWheel(secondsWheel, 59);
        minutesWheel.scrollTop = 5 * 40;
        secondsWheel.scrollTop = 0 * 40;

        function getSelectedMinutes() { return Math.round(minutesWheel.scrollTop / 40); }
        function getSelectedSeconds() { return Math.round(secondsWheel.scrollTop / 40); }
        function setWheelValues(mins, secs) {
            minutesWheel.scrollTop = mins * 40;
            secondsWheel.scrollTop = secs * 40;
        }

        function updateWheelHighlight(wheelEl) {
            const index = Math.round(wheelEl.scrollTop / 40);
            const items = wheelEl.querySelectorAll('.wheel-item');
            items.forEach((item, idx) => {
                if (idx === index + 1) item.classList.add('selected');
                else item.classList.remove('selected');
            });
        }

        minutesWheel.addEventListener('scroll', () => updateWheelHighlight(minutesWheel));
        secondsWheel.addEventListener('scroll', () => updateWheelHighlight(secondsWheel));
        updateWheelHighlight(minutesWheel);
        updateWheelHighlight(secondsWheel);

        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `Current Time: ${now.toLocaleTimeString()}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        function setUIState(running) {
            if (running) {
                modeTabs.style.display = 'none';
                pickerContainer.style.display = 'none';
                targetTimeContainer.style.display = 'none';
                mapViewContainer.style.display = 'none';
                activeDisplay.style.display = 'flex';
                quick5Btn.style.display = 'none';
                startBtn.textContent = CONFIG.stopBtnText;
            } else {
                document.body.classList.remove('race-active');
                modeTabs.style.display = 'flex';
                if (currentMode === 'duration') {
                    pickerContainer.style.display = 'flex';
                    quick5Btn.style.display = 'block';
                } else if (currentMode === 'target') {
                    targetTimeContainer.style.display = 'flex';
                } else if (currentMode === 'map') {
                    mapViewContainer.style.display = 'flex';
                    setTimeout(resizeCanvas, 50);
                }
                activeDisplay.style.display = 'none';
                startBtn.textContent = CONFIG.startBtnText;
            }
        }

        startBtn.addEventListener('click', async () => {
            unlockSpeechAudio();
            if (!isRunning) {
                let totalMs = 0;
                if (currentMode === 'duration') {
                    const mins = getSelectedMinutes();
                    const secs = getSelectedSeconds();
                    totalMs = (mins * 60 + secs) * 1000;
                } else {
                    const timeVal = timeInput.value;
                    if (!timeVal) {
                        messageEl.textContent = "Please set a target time";
                        return;
                    }
                    const [targetHours, targetMins] = timeVal.split(':').map(Number);
                    const now = new Date();
                    const targetDate = new Date();
                    targetDate.setHours(targetHours, targetMins, 0, 0);
                    if (targetDate.getTime() <= now.getTime()) {
                        targetDate.setDate(targetDate.getDate() + 1);
                    }
                    totalMs = targetDate.getTime() - now.getTime();
                }

                if (totalMs <= 0) {
                    messageEl.textContent = "Target time must be in the future";
                    return;
                }

                targetTime = Date.now() + totalMs;
                isRunning = true;
                lastSpokenSecond = -1;
                messageEl.textContent = CONFIG.runningMsg;
                setUIState(true);
                await requestWakeLock();
                speak(CONFIG.timerStartedSpeech, true);
            } else {
                isRunning = false;
                targetTime = null;
                messageEl.textContent = CONFIG.stoppedMsg;
                setUIState(false);
                await releaseWakeLock();
                speak(CONFIG.timerStoppedSpeech, true);
            }
        });

        quick5Btn.addEventListener('click', async () => {
            unlockSpeechAudio();
            setWheelValues(5, 0);
            targetTime = Date.now() + 5 * 60 * 1000;
            isRunning = true;
            lastSpokenSecond = -1;
            messageEl.textContent = CONFIG.runningMsg;
            setUIState(true);
            await requestWakeLock();
            speak(CONFIG.timerStartedSpeech, true);
        });

        function updateCountdown() {
            if (!isRunning || !targetTime) return;

            const now = Date.now();
            const distance = targetTime - now;
            
            // Overtime mode (past zero)
            if (distance <= 0) {
                const elapsedMs = Math.abs(distance);
                const totalElapsedSeconds = Math.floor(elapsedMs / 1000);
                const minutes = Math.floor(totalElapsedSeconds / 60);
                const seconds = totalElapsedSeconds % 60;

                // Switch background to white
                document.body.classList.add('race-active');

                activeSignEl.textContent = "+";
                activeMinsEl.textContent = String(minutes).padStart(2, '0');
                activeSecsEl.textContent = String(seconds).padStart(2, '0');
                messageEl.textContent = CONFIG.raceStartedMsg;

                if (lastSpokenSecond !== 0) {
                    playTone(CONFIG.doopFreq, CONFIG.doopDuration, CONFIG.doopType, CONFIG.doopVolume);
                    setTimeout(() => {
                        speak(CONFIG.raceStartedSpeech, true);
                    }, 1000);

                    lastSpokenSecond = 0;
                }
                return;
            }

            activeSignEl.textContent = " ";
            const totalSeconds = Math.ceil(distance / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            activeMinsEl.textContent = String(minutes).padStart(2, '0');
            activeSecsEl.textContent = String(seconds).padStart(2, '0');
            setWheelValues(minutes, seconds);

            if (totalSeconds !== lastSpokenSecond) {
                if (totalSeconds === 15) {
                    speak("15", true);
                } else if (totalSeconds >= 11 && totalSeconds <= 20) {
                    playTone(CONFIG.pipFreq, CONFIG.pipDuration, CONFIG.pipType, CONFIG.pipVolume);
                } else if (totalSeconds >= 1 && totalSeconds <= 10) {
                    speak(String(totalSeconds), false);
                } else if (totalSeconds < 180 && totalSeconds % 15 === 0) {
                    let speechText = minutes > 0 ? `${minutes} minutes` : `${seconds} seconds`;
                    speak(speechText, true);
                } else if (totalSeconds >= 180 && totalSeconds % 30 === 0) {
                    let speechText = minutes > 0 ? `${minutes} minutes` : `${seconds} seconds`;
                    speak(speechText, true);
                }

                lastSpokenSecond = totalSeconds;
            }
        }

        setInterval(updateCountdown, 100);
    </script>
</body>
</html>
