<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countdown Timer</title>

    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Countdown">
    <link rel="apple-touch-icon" href="sailboat.jpg">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px 10px;
        }

        .time-value {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--muted-color);
            min-height: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
        <h1 id="event-title">Countdown Timer</h1>

        <div class="timer-grid">
            <div class="time-box">
                <div class="time-value" id="minutes">05</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div class="message" id="message">Ready</div>

        <div class="controls">
            <button id="quick-5min-btn" class="btn-secondary">Start 5 Min Timer</button>
            <input type="number" id="minutes-input" placeholder="Minutes (e.g. 10)" min="1" max="1440">
            <button id="start-custom-btn">Start Custom Timer</button>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const minsEl = document.getElementById('minutes');
        const secsEl = document.getElementById('seconds');
        const messageEl = document.getElementById('message');
        const minutesInput = document.getElementById('minutes-input');
        const startCustomBtn = document.getElementById('start-custom-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');

        // Update live clock every second
        function updateLiveClock() {
            const now = new Date();
            liveClockEl.textContent = `Current Time: ${now.toLocaleTimeString()}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        let targetTime = Date.now() + 5 * 60 * 1000; // Default 5 mins
        let lastSpokenSecond = -1;

        // Speech synthesis helper
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop any pending speech so it doesn't queue up
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function setTimerDuration(minutes) {
            targetTime = Date.now() + (minutes * 60 * 1000);
            lastSpokenSecond = -1;
            messageEl.textContent = `${minutes} min timer started`;
            speak(`${minutes} minute timer started`);
        }

        quick5Btn.addEventListener('click', () => {
            setTimerDuration(5);
        });

        startCustomBtn.addEventListener('click', () => {
            const val = parseFloat(minutesInput.value);
            if (isNaN(val) || val <= 0) {
                messageEl.textContent = "Please enter valid minutes";
                return;
            }
            setTimerDuration(val);
        });

        function updateCountdown() {
            const now = Date.now();
            const distance = targetTime - now;
            const totalSeconds = Math.max(0, Math.floor(distance / 1000));

            if (totalSeconds === 0 && distance <= 0) {
                minsEl.textContent = "00";
                secsEl.textContent = "00";
                if (lastSpokenSecond !== 0) {
                    messageEl.textContent = "Time's up! 🎉";
                    speak("Time is up!");
                    lastSpokenSecond = 0;
                }
                return;
            }

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            minsEl.textContent = String(minutes).padStart(2, '0');
            secsEl.textContent = String(seconds).padStart(2, '0');

            // Speech interval logic
            if (totalSeconds !== lastSpokenSecond) {
                let shouldSpeak = false;

                if (totalSeconds < 15) {
                    // c. Under 15 seconds: speak every second
                    shouldSpeak = true;
                } else if (totalSeconds < 180) {
                    // b. Under 3 minutes (180s): speak every 15 seconds
                    if (totalSeconds % 15 === 0) shouldSpeak = true;
                } else {
                    // a. Above 3 minutes: speak every 30 seconds
                    if (totalSeconds % 30 === 0) shouldSpeak = true;
                }

                if (shouldSpeak) {
                    let timeText = "";
                    if (minutes > 0 && seconds > 0) {
                        timeText = `${minutes} minutes ${seconds} seconds`;
                    } else if (minutes > 0) {
                        timeText = `${minutes} minutes`;
                    } else {
                        timeText = `${seconds} seconds`;
                    }
                    speak(timeText);
                }

                lastSpokenSecond = totalSeconds;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
