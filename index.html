<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Beta Timer</title>

    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json?v=1.1.02">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Beta Timer">
    <link rel="apple-touch-icon" href="sailboat.jpg?v=1.1.02">

    <!-- External Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --warning-btn: #d97706;
            --warning-hover: #b45309;
            --muted-color: #9ca3af;
            --item-height: 48px;
        }

        body.race-active {
            --bg-color: #ffffff;
            --card-bg: #f3f4f6;
            --text-color: #121214;
            --muted-color: #4b5563;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            top: 0; left: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100%;
            background-color: var(--card-bg);
            border-radius: 22px;
            padding: 16px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .left-column {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex: 1;
            height: 100%;
            min-height: 0;
        }

        .header-section {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 8px;
            padding-top: 6px;
            overflow: visible;
        }

        .live-clock {
            font-size: 0.95rem;
            color: var(--muted-color);
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            line-height: 1.4;
            overflow: visible;
            display: block;
        }

        h1 {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 10px;
            padding: 2px;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        .picker-container, .target-time-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 16px;
            padding: 8px;
            flex: 1;
            min-height: 120px;
        }

        .target-time-container {
            display: none;
            flex-direction: column;
            padding: 12px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: center;
        }

        /* Strict Vertical-Only Scroll Behavior */
        .wheel {
            height: 100%;
            width: 100px;
            overflow-y: auto;
            overflow-x: hidden;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            background: rgba(128, 128, 128, 0.06);
            border-radius: 10px;
            -webkit-overflow-scrolling: touch;
            padding-top: calc(50% - (var(--item-height) / 2));
            padding-bottom: calc(50% - (var(--item-height) / 2));
            scroll-padding-top: calc(50% - (var(--item-height) / 2));
            scroll-padding-bottom: calc(50% - (var(--item-height) / 2));
            touch-action: pan-y;
            overscroll-behavior-x: none;
        }

        .wheel::-webkit-scrollbar { display: none; }

        .wheel-item {
            height: var(--item-height);
            min-height: var(--item-height);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.1rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            scroll-snap-align: center;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.15s, transform 0.15s;
        }

        .wheel-item.selected { opacity: 1.0; transform: scale(1.06); }

        .wheel-separator {
            font-size: 2.4rem;
            font-weight: 800;
            color: var(--text-color);
            padding-bottom: 6px;
        }

        .wheel-label, .target-time-label, .active-label {
            font-size: 0.62rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-top: 4px;
            font-weight: 600;
        }

        input[type="time"] {
            width: 80%;
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            background: rgba(128, 128, 128, 0.06);
            color: var(--text-color);
            font-size: 2.1rem;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
            font-weight: 700;
        }

        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 16px;
            padding: 16px;
            flex: 1;
            width: 100%;
        }

        .active-box { display: flex; flex-direction: column; align-items: center; }

        .active-value, .active-separator {
            font-size: 3.5rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
            line-height: 1;
        }

        .active-separator { color: var(--muted-color); padding-bottom: 6px; }

        .active-display.seconds-only .active-value { font-size: 7.5rem; letter-spacing: -4px; }

        .right-column { display: flex; flex-direction: column; flex: 1; min-height: 0; }

        .gps-logger-panel {
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 6px;
            background: rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(128, 128, 128, 0.2);
            border-radius: 16px;
            padding: 8px;
            flex: 1;
            min-height: 140px;
        }

        .gps-toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--muted-color);
            padding: 0 4px;
        }

        .switch { position: relative; display: inline-block; width: 36px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #374151;
            transition: 0.3s;
            border-radius: 18px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 12px; width: 12px;
            left: 3px; bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(18px); }

        .gps-stats {
            font-size: 0.75rem;
            color: var(--text-color);
            font-variant-numeric: tabular-nums;
            background: rgba(0,0,0,0.12);
            padding: 4px;
            border-radius: 6px;
            text-align: center;
        }

        .gps-legend {
            font-size: 0.62rem;
            background: rgba(0, 0, 0, 0.12);
            padding: 4px 6px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .legend-title {
            font-weight: 700;
            color: var(--muted-color);
            text-align: center;
            text-transform: uppercase;
            font-size: 0.55rem;
        }

        .legend-items { display: flex; justify-content: space-around; flex-wrap: wrap; gap: 2px; }
        .legend-item { display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; font-weight: 600; }
        .legend-color-box { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

        #map-wrapper { width: 100%; flex: 1; min-height: 80px; border-radius: 8px; overflow: hidden; position: relative; }
        #map-container { width: 100%; height: 100%; z-index: 1; background: #0f172a; }

        .download-btn { display: none; background-color: #059669; font-size: 0.8rem; padding: 8px; }
        .download-btn:hover { background-color: #047857; }

        .message { font-size: 0.8rem; margin-bottom: 8px; color: var(--muted-color); min-height: 16px; font-weight: 500; }

        .controls { display: flex; flex-direction: column; gap: 8px; }
        .controls-row { display: flex; gap: 8px; width: 100%; }

        button {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            z-index: 10;
        }

        button:active { transform: scale(0.98); }
        button:hover { background-color: var(--accent-hover); }
        .btn-secondary { background-color: var(--secondary-btn); }
        .btn-secondary:hover { background-color: var(--secondary-hover); }
        .btn-warning { background-color: var(--warning-btn); }
        .btn-warning:hover { background-color: var(--warning-hover); }

        #standalone-timer-overlay { display: none !important; }

        /* LANDSCAPE ADAPTIVE RULES */
        @media (orientation: landscape) {
            html, body { width: 100vw !important; height: 100vh !important; position: fixed !important; }
            body { padding: 0 !important; }

            .container {
                max-width: 100vw; max-height: 100vh;
                height: 100vh; width: 100vw;
                border-radius: 0; padding: 12px 24px;
            }

            /* Pre-Race Landscape Countdown Display */
            body:not(.race-active).landscape-mode .header-section h1,
            body:not(.race-active).landscape-mode .mode-tabs,
            body:not(.race-active).landscape-mode .picker-container,
            body:not(.race-active).landscape-mode .target-time-container,
            body:not(.race-active).landscape-mode .message,
            body:not(.race-active).landscape-mode .controls,
            body:not(.race-active).landscape-mode .right-column { display: none !important; }

            body:not(.race-active).landscape-mode .left-column {
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: center !important;
                height: 100% !important; width: 100% !important;
            }

            body:not(.race-active).landscape-mode .header-section {
                width: 100% !important;
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding-top: 4px !important;
            }

            body:not(.race-active).landscape-mode .live-clock { font-size: 1.15rem !important; margin-bottom: 0 !important; }

            body:not(.race-active).landscape-mode .active-display {
                display: flex !important;
                flex: 1 !important;
                width: 100% !important;
                max-width: 100vw !important;
                background: transparent !important;
                border: none !important;
                align-items: center !important;
                justify-content: center !important;
                padding: 0 !important;
            }

            body:not(.race-active).landscape-mode .active-value,
            body:not(.race-active).landscape-mode .active-separator {
                font-size: min(28vw, 68vh) !important;
                line-height: 0.85 !important;
                font-weight: 900 !important;
            }

            /* Race / Overtime Mode Landscape Overlay Fix */
            body.race-active.landscape-mode .container {
                display: block !important;
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                border-radius: 0 !important; padding: 0 !important;
                background: transparent !important;
            }

            body.race-active.landscape-mode .left-column { display: none !important; }
            body.race-active.landscape-mode .right-column {
                display: block !important;
                position: fixed !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                z-index: 100;
            }

            body.race-active.landscape-mode .gps-logger-panel {
                display: block !important; position: absolute !important;
                top: 0 !important; left: 0 !important;
                width: 100vw !important; height: 100vh !important;
                border: none !important; background: #000 !important; padding: 0 !important;
            }

            body.race-active.landscape-mode .gps-toggle-row,
            body.race-active.landscape-mode .gps-legend { display: none !important; }

            body.race-active.landscape-mode #map-wrapper,
            body.race-active.landscape-mode #map-container { width: 100vw !important; height: 100vh !important; }

            body.race-active.landscape-mode #standalone-timer-overlay {
                display: flex !important;
                position: fixed !important;
                top: max(10px, env(safe-area-inset-top)) !important;
                left: max(16px, env(safe-area-inset-left)) !important;
                background: rgba(0, 0, 0, 0.45) !important;
                backdrop-filter: blur(6px) !important;
                -webkit-backdrop-filter: blur(6px) !important;
                border: 1px solid rgba(255, 255, 255, 0.3) !important;
                border-radius: 14px !important;
                padding: 6px 14px !important;
                z-index: 999999 !important;
                align-items: center !important;
                gap: 8px !important;
            }

            body.race-active.landscape-mode #standalone-timer-overlay .active-box {
                display: flex !important;
                flex-direction: row !important;
                align-items: center !important;
            }

            body.race-active.landscape-mode #standalone-timer-overlay #box-sign,
            body.race-active.landscape-mode #standalone-timer-overlay .active-label { display: none !important; }

            body.race-active.landscape-mode #standalone-timer-overlay .active-value,
            body.race-active.landscape-mode #standalone-timer-overlay .active-separator {
                font-size: 2.8rem !important;
                line-height: 1 !important;
                color: #ffffff !important;
                text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
            }

            body.race-active.landscape-mode .gps-stats {
                position: fixed !important;
                bottom: max(10px, env(safe-area-inset-bottom)) !important; 
                left: max(16px, env(safe-area-inset-left)) !important;
                background: rgba(0, 0, 0, 0.45) !important;
                backdrop-filter: blur(6px) !important;
                -webkit-backdrop-filter: blur(6px) !important;
                color: #ffffff !important;
                padding: 6px 14px !important;
                border-radius: 12px !important;
                border: 1px solid rgba(255, 255, 255, 0.25) !important;
                font-size: 0.85rem !important;
                z-index: 999999 !important;
                font-weight: 700 !important;
            }

            body.race-active.landscape-mode .download-btn { display: none !important; }
        }
    </style>
</head>
<body>

    <video id="wake-lock-video" playsinline loop muted style="display:none;">
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAAIZnJlZQAAAAptZGF0AAAAAA==" type="video/mp4">
    </video>

    <div id="standalone-timer-overlay" class="active-display"></div>

    <div class="container">
        <div class="left-column">
            <div class="header-section">
                <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
                <h1 id="event-title">Beta Timer</h1>
            </div>

            <div class="mode-tabs" id="mode-tabs">
                <button class="tab-btn active" id="duration-tab">Duration</button>
                <button class="tab-btn" id="target-time-tab">Target Time</button>
            </div>

            <div class="picker-container" id="picker-container">
                <div class="wheel-column">
                    <div class="wheel" id="minutes-wheel"></div>
                    <div class="wheel-label">Minutes</div>
                </div>
                <div class="wheel-separator">:</div>
                <div class="wheel-column">
                    <div class="wheel" id="seconds-wheel"></div>
                    <div class="wheel-label">Seconds</div>
                </div>
            </div>

            <div class="target-time-container" id="target-time-container">
                <input type="time" id="time-input">
                <div class="target-time-label">Set Target Time (Hours : Minutes)</div>
            </div>

            <div class="active-display" id="active-display">
                <div class="active-box" id="box-sign" style="display:none;">
                    <div class="active-value" id="active-sign">&nbsp;</div>
                    <div class="active-label" id="active-mode-label">&nbsp;</div>
                </div>
                <div class="active-box" id="box-mins">
                    <div class="active-value" id="active-mins">05</div>
                    <div class="active-label">Minutes</div>
                </div>
                <div class="active-separator" id="box-sep">:</div>
                <div class="active-box" id="box-secs">
                    <div class="active-value" id="active-secs">00</div>
                    <div class="active-label">Seconds</div>
                </div>
            </div>

            <div class="message" id="message">Scroll wheels to set duration</div>

            <div class="controls">
                <button id="start-btn">Start Countdown</button>
                <div class="controls-row">
                    <button id="pause-btn" class="btn-warning" style="display:none;">Pause</button>
                    <button id="quick-5min-btn" class="btn-secondary">Quick 5 Min Timer</button>
                </div>
            </div>
        </div>

        <div class="right-column">
            <div class="gps-logger-panel" id="gps-logger-panel">
                <div class="gps-toggle-row">
                    <span>Record Live GPS Track</span>
                    <label class="switch">
                        <input type="checkbox" id="gps-toggle" checked>
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="gps-toggle-row" style="margin-top: 2px;">
                    <span>Satellite Map View</span>
                    <label class="switch">
                        <input type="checkbox" id="map-style-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
                <div class="gps-stats" id="gps-stats">Awaiting GPS fix...</div>
                <div class="gps-legend" id="gps-legend">
                    <div class="legend-title">Speed Legend (Knots)</div>
                    <div class="legend-items">
                        <div class="legend-item"><span class="legend-color-box" style="background: #38bdf8;"></span>&lt;3</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #818cf8;"></span>3-4</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #6366f1;"></span>4-5</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #10b981;"></span>5-6</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #84cc16;"></span>6-7</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #f59e0b;"></span>7-8</div>
                        <div class="legend-item"><span class="legend-color-box" style="background: #ef4444;"></span>8+</div>
                    </div>
                </div>
                <div id="map-wrapper"><div id="map-container"></div></div>
                <button class="download-btn" id="download-track-btn">Download Track Map (PNG)</button>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            appTitle: "Beta Timer",
            startBtnText: "Start Countdown",
            stopBtnText: "Reset / Stop",
            quick5BtnText: "Quick 5 Min Timer",
            runningMsg: "Countdown running...",
            pausedMsg: "Timer paused",
            stoppedMsg: "Timer stopped",
            raceStartedMsg: "Race started! 🏁",
            timerStartedSpeech: "Timer started",
            timerPausedSpeech: "Timer paused",
            timerResumedSpeech: "Timer resumed",
            timerStoppedSpeech: "Timer stopped",
            raceStartedSpeech: "Race started",
            defaultDurationMsg: "Scroll wheels to set duration",
            targetTimeMsg: "Set target hours and minutes",

            buoyMarkerScale: 0.45,
            pipFreq: 440, pipDuration: 0.200, pipType: "sine", pipVolume: 2.0,
            doopFreq: 659.25, doopDuration: 0.75, doopType: "triangle", doopVolume: 2.0,
            speechRate: 1.0, speechPitch: 1.0, speechVoiceLang: "en-GB" 
        };

        const liveClockEl = document.getElementById('live-clock');
        const messageEl = document.getElementById('message');
        const eventTitleEl = document.getElementById('event-title');
        const modeTabs = document.getElementById('mode-tabs');
        const durationTab = document.getElementById('duration-tab');
        const targetTimeTab = document.getElementById('target-time-tab');
        const pickerContainer = document.getElementById('picker-container');
        const targetTimeContainer = document.getElementById('target-time-container');
        const timeInput = document.getElementById('time-input');
        const activeDisplay = document.getElementById('active-display');
        const standaloneTimerOverlay = document.getElementById('standalone-timer-overlay');
        const activeSignEl = document.getElementById('active-sign');
        const activeModeLabelEl = document.getElementById('active-mode-label');
        const activeMinsEl = document.getElementById('active-mins');
        const activeSecsEl = document.getElementById('active-secs');
        const boxSign = document.getElementById('box-sign');
        const boxMins = document.getElementById('box-mins');
        const boxSep = document.getElementById('box-sep');
        const boxSecs = document.getElementById('box-secs');
        const minutesWheel = document.getElementById('minutes-wheel');
        const secondsWheel = document.getElementById('seconds-wheel');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');
        
        const gpsLoggerPanel = document.getElementById('gps-logger-panel');
        const gpsToggle = document.getElementById('gps-toggle');
        const mapStyleToggle = document.getElementById('map-style-toggle');
        const gpsStats = document.getElementById('gps-stats');
        const downloadTrackBtn = document.getElementById('download-track-btn');
        const wakeVideo = document.getElementById('wake-lock-video');

        eventTitleEl.textContent = CONFIG.appTitle;
        startBtn.textContent = CONFIG.startBtnText;
        quick5Btn.textContent = CONFIG.quick5BtnText;
        messageEl.textContent = CONFIG.defaultDurationMsg;

        let targetTime = null, remainingTimeMsAtPause = null;
        let isRunning = false, isPaused = false;
        let lastSpokenSecond = -1, hasPlayedRaceStart = false;
        let currentMode = 'duration', audioCtx = null, wakeLock = null, cachedVoice = null;

        let watchId = null, gpsTrackPoints = [], isOvertimeActive = false;
        let leafletMap = null, normalLayer = null, satelliteLayer = null, polylineGroup = null, sectorLayer = null, meanHeadingLineLayer = null;
        let latestLat = null, latestLon = null, latestKnots = "0.0";

        const getItemHeight = () => 48;

        function calculateHeadingStats(bearings, scaleFactor = 0.5) {
            if (!bearings || !bearings.length) return { mean: 0, spread: 0 };
            let sumSin = 0, sumCos = 0;
            bearings.forEach(b => {
                const rad = (b * Math.PI) / 180;
                sumSin += Math.sin(rad); sumCos += Math.cos(rad);
            });
            const n = bearings.length;
            let meanDeg = (Math.atan2(sumSin / n, sumCos / n) * 180) / Math.PI;
            if (meanDeg < 0) meanDeg += 360;
            const R = Math.sqrt((sumSin/n)**2 + (sumCos/n)**2);
            const circStdDevDeg = (R > 0 ? Math.sqrt(-2 * Math.log(R)) : 0) * 180 / Math.PI;
            return { mean: meanDeg, spread: Math.min(Math.max(circStdDevDeg * scaleFactor, 3), 30) };
        }

        function getDestinationPoint(lat, lon, bearingDeg, distanceMeters) {
            const R = 6371000, δ = distanceMeters / R, θ = (bearingDeg * Math.PI) / 180;
            const φ1 = (lat * Math.PI) / 180, λ1 = (lon * Math.PI) / 180;
            const sinφ1 = Math.sin(φ1), cosφ1 = Math.cos(φ1), sind = Math.sin(δ), cosd = Math.cos(δ);
            const φ2 = Math.asin(sinφ1 * cosd + cosφ1 * sind * Math.cos(θ));
            const y = Math.sin(θ) * sind * cosφ1, x = cosd - sinφ1 * Math.sin(φ2);
            return [(φ2 * 180) / Math.PI, ((λ1 + Math.atan2(y, x)) * 180) / Math.PI];
        }

        function generateSectorPolygon(boatLat, boatLon, bearings, radiusMeters = 5556, numArcPoints = 16) {
            const { mean, spread } = calculateHeadingStats(bearings);
            const startBearing = mean - spread, step = (spread * 2) / (numArcPoints - 1);
            const polygonCoords = [[boatLat, boatLon]];
            for (let i = 0; i < numArcPoints; i++) {
                polygonCoords.push(getDestinationPoint(boatLat, boatLon, startBearing + (step * i), radiusMeters));
            }
            polygonCoords.push([boatLat, boatLon]);
            return { polygonCoords, meanHeading: mean };
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const φ1 = (lat1 * Math.PI) / 180, φ2 = (lat2 * Math.PI) / 180;
            const Δλ = ((lon2 - lon1) * Math.PI) / 180;
            const y = Math.sin(Δλ) * Math.cos(φ2);
            const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
            return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
        }

        function updateTelemetryText() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape && isOvertimeActive) gpsStats.textContent = `SOG: ${latestKnots} kts`;
            else if (latestLat !== null && latestLon !== null) gpsStats.textContent = `Lat: ${latestLat.toFixed(5)}, Lon: ${latestLon.toFixed(5)} | SOG: ${latestKnots} kts`;
        }

        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            document.body.classList.toggle('landscape-mode', isLandscape);

            if (isLandscape && isOvertimeActive) {
                if (!standaloneTimerOverlay.children.length) {
                    [boxSign, boxMins, boxSep, boxSecs].forEach(el => standaloneTimerOverlay.appendChild(el));
                }
            } else {
                if (standaloneTimerOverlay.children.length) {
                    [boxSign, boxMins, boxSep, boxSecs].forEach(el => activeDisplay.appendChild(el));
                }
            }
            updateTelemetryText();
            if (leafletMap) setTimeout(() => leafletMap.invalidateSize(), 150);
        }

        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                checkOrientation();
                setWheelValues(getSelectedMinutes() >= 0 ? getSelectedMinutes() : 5, getSelectedSeconds() >= 0 ? getSelectedSeconds() : 0);
            }, 300);
        });

        function initLeafletMap(lat, lon) {
            if (leafletMap) return;
            leafletMap = L.map('map-container', { zoomControl: false, attributionControl: false }).setView([lat, lon], 14);

            normalLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, crossOrigin: true }).addTo(leafletMap);
            satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, crossOrigin: true });

            mapStyleToggle.addEventListener('change', () => {
                if (mapStyleToggle.checked) { normalLayer.remove(); satelliteLayer.addTo(leafletMap); }
                else { satelliteLayer.remove(); normalLayer.addTo(leafletMap); }
            });

            polylineGroup = L.layerGroup().addTo(leafletMap);

            const scaledW = Math.round(32 * CONFIG.buoyMarkerScale), scaledH = Math.round(36 * CONFIG.buoyMarkerScale);
            const orangeBuoyIcon = L.divIcon({
                className: 'racing-buoy-marker',
                html: `<svg width="${scaledW}" height="${scaledH}" viewBox="0 0 32 36" style="filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.6));">
                    <circle cx="16" cy="4" r="3" fill="none" stroke="#ffffff" stroke-width="2.5"/>
                    <path d="M 10 7 Q 16 6 22 7 L 26 26 Q 16 32 6 26 Z" fill="url(#buoyGrad)" stroke="#b33b00" stroke-width="1"/>
                    <path d="M 12 14 Q 16 13.5 20 14 L 21 19 Q 16 20.5 11 19 Z" fill="#ffffff" opacity="0.9"/>
                    <defs><radialGradient id="buoyGrad" cx="35%" cy="35%" r="65%"><stop offset="0%" stop-color="#ff9933"/><stop offset="55%" stop-color="#ff5500"/><stop offset="100%" stop-color="#cc3300"/></radialGradient></defs>
                </svg>`,
                iconSize: [scaledW, scaledH], iconAnchor: [Math.round(scaledW / 2), scaledH], popupAnchor: [0, -scaledH]
            });

            [
                { name: "Beashel", lat: -33.838867, lon: 151.269750 },
                { name: "Shark Mark", lat: -33.860150, lon: 151.259533 },
                { name: "N3", lat: -33.859517, lon: 151.242283 },
                { name: "EC", lat: -33.840650, lon: 151.270817 }
            ].forEach(mark => {
                L.marker([mark.lat, mark.lon], { icon: orangeBuoyIcon }).addTo(leafletMap)
                    .bindPopup(`<b>${mark.name}</b><br>Lat: ${mark.lat.toFixed(6)}°<br>Lon: ${mark.lon.toFixed(6)}°`);
            });

            setTimeout(() => leafletMap.invalidateSize(), 250);
        }

        function getSpeedColor(knots) {
            const k = parseFloat(knots);
            if (k < 3.0) return '#38bdf8'; if (k < 4.0) return '#818cf8'; if (k < 5.0) return '#6366f1';
            if (k < 6.0) return '#10b981'; if (k < 7.0) return '#84cc16'; if (k < 8.0) return '#f59e0b';
            return '#ef4444';
        }

        function updateMapTrack() {
            if (!leafletMap) return;
            if (isPaused || !gpsToggle.checked) {
                if (sectorLayer) { sectorLayer.remove(); sectorLayer = null; }
                if (meanHeadingLineLayer) { meanHeadingLineLayer.remove(); meanHeadingLineLayer = null; }
                return;
            }

            if (gpsTrackPoints.length > 1) {
                polylineGroup.clearLayers();
                for (let i = 0; i < gpsTrackPoints.length - 1; i++) {
                    const p1 = gpsTrackPoints[i], p2 = gpsTrackPoints[i + 1];
                    L.polyline([[p1.lat, p1.lon], [p2.lat, p2.lon]], { color: getSpeedColor(p2.knots), weight: 3.5, opacity: 0.95 }).addTo(polylineGroup);
                }
            }

            if (latestLat !== null && latestLon !== null && gpsTrackPoints.length > 0) {
                const recentHeadings = gpsTrackPoints.slice(-15).map(pt => pt.heading);
                const { polygonCoords, meanHeading } = generateSectorPolygon(latestLat, latestLon, recentHeadings, 5556, 16);
                
                if (!sectorLayer) sectorLayer = L.polygon(polygonCoords, { color: '#ef4444', stroke: false, fillColor: '#ef4444', fillOpacity: 0.22 }).addTo(leafletMap);
                else sectorLayer.setLatLngs(polygonCoords);

                const meanLineCoords = [[latestLat, latestLon], getDestinationPoint(latestLat, latestLon, meanHeading, 5556)];
                if (!meanHeadingLineLayer) meanHeadingLineLayer = L.polyline(meanLineCoords, { color: '#ef4444', weight: 3, dashArray: '8, 6', opacity: 0.95 }).addTo(leafletMap);
                else meanHeadingLineLayer.setLatLngs(meanLineCoords);
            }
        }

        function startGPSTracking() {
            if ('geolocation' in navigator) {
                watchId = navigator.geolocation.watchPosition(
                    (pos) => {
                        if (!isOvertimeActive || isPaused || !gpsToggle.checked) return;
                        latestLat = pos.coords.latitude; latestLon = pos.coords.longitude;
                        latestKnots = pos.coords.speed ? (pos.coords.speed * 1.94384).toFixed(1) : '0.0';
                        
                        let heading = 0;
                        if (gpsTrackPoints.length > 0) {
                            const pastPt = gpsTrackPoints[Math.max(0, gpsTrackPoints.length - 5)];
                            heading = calculateBearing(pastPt.lat, pastPt.lon, latestLat, latestLon);
                        }

                        gpsTrackPoints.push({ lat: latestLat, lon: latestLon, knots: latestKnots, heading });
                        updateTelemetryText();
                        if (!leafletMap) initLeafletMap(latestLat, latestLon);
                        else { leafletMap.invalidateSize(); updateMapTrack(); }
                    },
                    () => { gpsStats.textContent = "GPS signal unavailable"; },
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            } else gpsStats.textContent = "Geolocation not supported";
        }

        function stopGPSTracking() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (sectorLayer) { sectorLayer.remove(); sectorLayer = null; }
            if (meanHeadingLineLayer) { meanHeadingLineLayer.remove(); meanHeadingLineLayer = null; }
            if (leafletMap) { leafletMap.remove(); leafletMap = null; polylineGroup = null; }
        }

        gpsToggle.addEventListener('change', () => {
            if (!gpsToggle.checked) {
                if (sectorLayer) { sectorLayer.remove(); sectorLayer = null; }
                if (meanHeadingLineLayer) { meanHeadingLineLayer.remove(); meanHeadingLineLayer = null; }
                if (polylineGroup) polylineGroup.clearLayers();
            } else if (isOvertimeActive) updateMapTrack();
        });

        downloadTrackBtn.addEventListener('click', () => {
            html2canvas(document.getElementById('map-wrapper'), { useCORS: true, allowTaint: true, scale: 2 }).then(canvas => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob), link = document.createElement('a');
                    link.href = url; link.download = `beta-timer-track-${Date.now()}.png`;
                    document.body.appendChild(link); link.click(); document.body.removeChild(link);
                    URL.revokeObjectURL(url);
                }, 'image/png');
            });
        });

        async function requestWakeLock() {
            if ('wakeLock' in navigator) { try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {} }
            if (wakeVideo) wakeVideo.play().catch(() => {});
        }

        async function releaseWakeLock() {
            if (wakeLock) { try { await wakeLock.release(); wakeLock = null; } catch (e) {} }
            if (wakeVideo) wakeVideo.pause();
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && isRunning) await requestWakeLock();
        });

        function initAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, duration, type, volume) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function loadVoice() {
            if (!('speechSynthesis' in window)) return;
            const voices = window.speechSynthesis.getVoices();
            if (voices.length) cachedVoice = voices.find(v => v.lang.startsWith(CONFIG.speechVoiceLang)) || voices[0];
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = loadVoice; loadVoice();
        }

        function speak(text, forceCancel = false) {
            if (!('speechSynthesis' in window)) return;
            if (forceCancel) window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = CONFIG.speechRate; utterance.pitch = CONFIG.speechPitch; utterance.lang = CONFIG.speechVoiceLang;
            if (cachedVoice) utterance.voice = cachedVoice;
            window.speechSynthesis.speak(utterance);
        }

        function unlockSpeechAudio() {
            initAudioContext();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.resume();
                const dummy = new SpeechSynthesisUtterance(''); dummy.volume = 0;
                window.speechSynthesis.speak(dummy);
            }
        }

        const defaultTarget = new Date(Date.now() + 5 * 60 * 1000);
        timeInput.value = `${String(defaultTarget.getHours()).padStart(2, '0')}:${String(defaultTarget.getMinutes()).padStart(2, '0')}`;

        durationTab.addEventListener('click', () => {
            if (isRunning || isPaused) return;
            currentMode = 'duration';
            durationTab.classList.add('active'); targetTimeTab.classList.remove('active');
            pickerContainer.style.display = 'flex'; targetTimeContainer.style.display = 'none';
            quick5Btn.style.display = 'block'; messageEl.textContent = CONFIG.defaultDurationMsg;
        });

        targetTimeTab.addEventListener('click', () => {
            if (isRunning || isPaused) return;
            currentMode = 'target';
            targetTimeTab.classList.add('active'); durationTab.classList.remove('active');
            pickerContainer.style.display = 'none'; targetTimeContainer.style.display = 'flex';
            quick5Btn.style.display = 'none'; messageEl.textContent = CONFIG.targetTimeMsg;
        });

        function populateWheel(wheelEl, maxVal) {
            let html = '';
            for (let i = 0; i <= maxVal; i++) html += `<div class="wheel-item" data-value="${i}">${String(i).padStart(2, '0')}</div>`;
            wheelEl.innerHTML = html;
            wheelEl.querySelectorAll('.wheel-item').forEach(item => {
                item.addEventListener('click', () => {
                    if (!isRunning && !isPaused) wheelEl.scrollTo({ top: parseInt(item.dataset.value, 10) * getItemHeight(), behavior: 'smooth' });
                });
            });
        }

        populateWheel(minutesWheel, 59); populateWheel(secondsWheel, 59);

        const getSelectedMinutes = () => Math.round(minutesWheel.scrollTop / getItemHeight());
        const getSelectedSeconds = () => Math.round(secondsWheel.scrollTop / getItemHeight());
        
        function setWheelValues(mins, secs) {
            const h = getItemHeight();
            minutesWheel.scrollTop = mins * h; secondsWheel.scrollTop = secs * h;
        }

        function updateWheelHighlight(wheelEl) {
            const selectedIdx = Math.round(wheelEl.scrollTop / getItemHeight());
            wheelEl.querySelectorAll('.wheel-item').forEach((item, idx) => {
                item.classList.toggle('selected', idx === selectedIdx);
            });
        }

        minutesWheel.addEventListener('scroll', () => updateWheelHighlight(minutesWheel), { passive: true });
        secondsWheel.addEventListener('scroll', () => updateWheelHighlight(secondsWheel), { passive: true });

        setWheelValues(5, 0); updateWheelHighlight(minutesWheel); updateWheelHighlight(secondsWheel);

        const haltWheelInertia = () => setWheelValues(getSelectedMinutes(), getSelectedSeconds());

        setInterval(() => { liveClockEl.textContent = `Current Time: ${new Date().toLocaleTimeString()}`; }, 1000);

        function setUIState(runningOrPaused) {
            if (runningOrPaused) {
                modeTabs.style.display = 'none'; pickerContainer.style.display = 'none'; targetTimeContainer.style.display = 'none';
                activeDisplay.style.display = 'flex'; quick5Btn.style.display = 'none'; pauseBtn.style.display = 'block';
                startBtn.textContent = CONFIG.stopBtnText;
            } else {
                document.body.classList.remove('race-active');
                modeTabs.style.display = 'flex';
                if (currentMode === 'duration') { pickerContainer.style.display = 'flex'; quick5Btn.style.display = 'block'; }
                else targetTimeContainer.style.display = 'flex';
                activeDisplay.style.display = 'none'; activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'none'; boxMins.style.display = 'flex'; boxSep.style.display = 'block';
                gpsLoggerPanel.style.display = 'none'; pauseBtn.style.display = 'none'; pauseBtn.textContent = "Pause";
                isOvertimeActive = false; hasPlayedRaceStart = false; stopGPSTracking();
                gpsTrackPoints = []; latestLat = null; latestLon = null;
                startBtn.textContent = CONFIG.startBtnText;
                checkOrientation();
                setTimeout(() => { setWheelValues(5, 0); updateWheelHighlight(minutesWheel); updateWheelHighlight(secondsWheel); }, 50);
            }
        }

        startBtn.addEventListener('click', async () => {
            haltWheelInertia(); unlockSpeechAudio();
            if (!isRunning && !isPaused) {
                let totalMs = 0;
                if (currentMode === 'duration') totalMs = (getSelectedMinutes() * 60 + getSelectedSeconds()) * 1000;
                else {
                    if (!timeInput.value) { messageEl.textContent = "Please set a target time"; return; }
                    const [h, m] = timeInput.value.split(':').map(Number), now = new Date(), target = new Date();
                    target.setHours(h, m, 0, 0);
                    if (target.getTime() <= now.getTime()) target.setDate(target.getDate() + 1);
                    totalMs = target.getTime() - now.getTime();
                }
                if (totalMs <= 0) { messageEl.textContent = "Target time must be in the future"; return; }
                targetTime = Date.now() + totalMs; isRunning = true; isPaused = false; lastSpokenSecond = -1; hasPlayedRaceStart = false;
                messageEl.textContent = CONFIG.runningMsg; setUIState(true);
                await requestWakeLock(); speak(CONFIG.timerStartedSpeech, true);
            } else {
                isRunning = false; isPaused = false; targetTime = null; remainingTimeMsAtPause = null; hasPlayedRaceStart = false;
                messageEl.textContent = CONFIG.stoppedMsg; setUIState(false);
                await releaseWakeLock(); speak(CONFIG.timerStoppedSpeech, true);
            }
        });

        pauseBtn.addEventListener('click', async () => {
            if (isRunning && !isPaused) {
                isRunning = false; isPaused = true; remainingTimeMsAtPause = targetTime - Date.now();
                messageEl.textContent = CONFIG.pausedMsg; pauseBtn.textContent = "Resume";
                if (sectorLayer) { sectorLayer.remove(); sectorLayer = null; }
                if (meanHeadingLineLayer) { meanHeadingLineLayer.remove(); meanHeadingLineLayer = null; }
                await releaseWakeLock(); speak(CONFIG.timerPausedSpeech, true);
            } else if (!isRunning && isPaused) {
                targetTime = Date.now() + remainingTimeMsAtPause; isRunning = true; isPaused = false;
                messageEl.textContent = CONFIG.runningMsg; pauseBtn.textContent = "Pause";
                await requestWakeLock(); speak(CONFIG.timerResumedSpeech, true);
            }
        });

        quick5Btn.addEventListener('click', async () => {
            haltWheelInertia(); unlockSpeechAudio();
            currentMode = 'duration'; durationTab.classList.add('active'); targetTimeTab.classList.remove('active');
            pickerContainer.style.display = 'none'; targetTimeContainer.style.display = 'none';
            setWheelValues(5, 0); updateWheelHighlight(minutesWheel); updateWheelHighlight(secondsWheel);
            targetTime = Date.now() + 5 * 60 * 1000; isRunning = true; isPaused = false; lastSpokenSecond = -1; hasPlayedRaceStart = false;
            messageEl.textContent = CONFIG.runningMsg; setUIState(true);
            await requestWakeLock(); speak(CONFIG.timerStartedSpeech, true);
        });

        function updateCountdown() {
            if (!isRunning || !targetTime) return;
            const distance = targetTime - Date.now();
            
            if (distance <= 0) {
                const totalElapsedSeconds = Math.floor(Math.abs(distance) / 1000);
                const minutes = Math.floor(totalElapsedSeconds / 60), seconds = totalElapsedSeconds % 60;

                if (!isOvertimeActive) {
                    isOvertimeActive = true; gpsLoggerPanel.style.display = 'flex'; downloadTrackBtn.style.display = 'block';
                    startGPSTracking(); checkOrientation();
                }

                activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'flex'; boxMins.style.display = 'flex'; boxSep.style.display = 'block';
                document.body.classList.add('race-active');

                activeSignEl.textContent = "+"; activeModeLabelEl.textContent = "Overtime";
                activeMinsEl.textContent = String(minutes).padStart(2, '0'); activeSecsEl.textContent = String(seconds).padStart(2, '0');
                messageEl.textContent = CONFIG.raceStartedMsg;

                if (!hasPlayedRaceStart) {
                    hasPlayedRaceStart = true;
                    playTone(CONFIG.doopFreq, CONFIG.doopDuration, CONFIG.doopType, CONFIG.doopVolume);
                    setTimeout(() => speak(CONFIG.raceStartedSpeech, true), 800);
                }
                return;
            }

            const totalSeconds = Math.ceil(distance / 1000);
            const minutes = Math.floor(totalSeconds / 60), seconds = totalSeconds % 60;

            if (minutes === 0) {
                activeDisplay.classList.add('seconds-only');
                boxSign.style.display = 'none'; boxMins.style.display = 'none'; boxSep.style.display = 'none';
                activeSecsEl.textContent = String(seconds);
            } else {
                activeDisplay.classList.remove('seconds-only');
                boxSign.style.display = 'none'; boxMins.style.display = 'flex'; boxSep.style.display = 'block';
                activeMinsEl.textContent = String(minutes).padStart(2, '0'); activeSecsEl.textContent = String(seconds).padStart(2, '0');
            }

            setWheelValues(minutes, seconds);

            if (totalSeconds !== lastSpokenSecond) {
                if (totalSeconds === 15) speak("15", true);
                else if (totalSeconds >= 11 && totalSeconds <= 20) playTone(CONFIG.pipFreq, CONFIG.pipDuration, CONFIG.pipType, CONFIG.pipVolume);
                else if (totalSeconds >= 1 && totalSeconds <= 10) speak(String(totalSeconds), false);
                else if (totalSeconds < 180 && totalSeconds % 15 === 0) speak((minutes > 0 ? `${minutes} minutes ` : '') + `${seconds} seconds`, true);
                else if (totalSeconds >= 180 && totalSeconds % 30 === 0) speak((minutes > 0 ? `${minutes} minutes ` : '') + `${seconds} seconds`, true);
                lastSpokenSecond = totalSeconds;
            }
        }

        setInterval(updateCountdown, 250);
        checkOrientation();
    </script>
</body>
</html>
