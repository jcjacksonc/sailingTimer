<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countdown PWA</title>

    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Countdown">
    <link rel="apple-touch-icon" href="sailboat.jpg">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 10px;
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .time-label {
            font-size: 0.75rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--muted-color);
            min-height: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="datetime-local"] {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: var(--text-color);
            font-size: 1rem;
            text-align: center;
            outline: none;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
        <h1 id="event-title">Countdown</h1>

        <div class="timer-grid">
            <div class="time-box">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-box">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div class="message" id="message">Select a target time or quick start</div>

        <div class="controls">
            <button id="quick-5min-btn" class="btn-secondary">Start 5 Min Timer</button>
            <input type="datetime-local" id="datetime-picker">
            <button id="start-btn">Set Custom Countdown</button>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minsEl = document.getElementById('minutes');
        const secsEl = document.getElementById('seconds');
        const messageEl = document.getElementById('message');
        const pickerEl = document.getElementById('datetime-picker');
        const startBtn = document.getElementById('start-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');

        // Update live clock every second
        function updateLiveClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            liveClockEl.textContent = `Current Time: ${timeString}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // Target time management
        let targetTime = localStorage.getItem('pwa_target') 
            ? new Date(localStorage.getItem('pwa_target')) 
            : new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);

        // Pre-fill picker
        pickerEl.value = new Date(targetTime.getTime() - (targetTime.getTimezoneOffset() * 60000))
            .toISOString()
            .slice(0, 16);

        // Custom Countdown Button
        startBtn.addEventListener('click', () => {
            if (!pickerEl.value) return;
            targetTime = new Date(pickerEl.value);
            localStorage.setItem('pwa_target', targetTime);
            messageEl.textContent = "Custom countdown active!";
        });

        // 5-Minute Quick Timer Button
        quick5Btn.addEventListener('click', () => {
            targetTime = new Date(Date.now() + 5 * 60 * 1000);
            localStorage.setItem('pwa_target', targetTime);
            
            // Update input picker to match
            pickerEl.value = new Date(targetTime.getTime() - (targetTime.getTimezoneOffset() * 60000))
                .toISOString()
                .slice(0, 16);
                
            messageEl.textContent = "5-minute timer started!";
        });

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetTime.getTime() - now;

            if (distance < 0) {
                daysEl.textContent = "00";
                hoursEl.textContent = "00";
                minsEl.textContent = "00";
                secsEl.textContent = "00";
                messageEl.textContent = "Time's up! 🎉";
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            daysEl.textContent = String(days).padStart(2, '0');
            hoursEl.textContent = String(hours).padStart(2, '0');
            minsEl.textContent = String(minutes).padStart(2, '0');
            secsEl.textContent = String(seconds).padStart(2, '0');
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // Register Service Worker for PWA functionality
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch((err) => console.log('SW registration failed:', err));
            });
        }
    </script>
</body>
</html>
