<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Beta Timer - Sailing PWA</title>
  
  <!-- Leaflet CSS for Map Overlays -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151b2b;
      --accent-cyan: #00d2ff;
      --accent-green: #00e676;
      --accent-red: #ff5252;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #2a344d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: manipulation;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
    }

    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: rgba(255, 82, 82, 0.2);
      color: var(--accent-red);
      font-weight: 600;
    }

    .status-badge.active {
      background: rgba(0, 230, 118, 0.2);
      color: var(--accent-green);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #map {
      flex: 1;
      width: 100%;
      background: #111;
      z-index: 1;
    }

    .dashboard-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      pointer-events: none;
    }

    .metric-card {
      background: rgba(21, 27, 43, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      pointer-events: auto;
    }

    .metric-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .metric-value {
      font-size: 1.1rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .controls-dock {
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10;
    }

    .timer-display {
      font-size: 2.5rem;
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
    }

    .button-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    button {
      background-color: #2a344d;
      color: var(--text-main);
      border: none;
      border-radius: 8px;
      padding: 14px 0;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    button.primary {
      background-color: var(--accent-cyan);
      color: #0b0f19;
    }

    button.danger {
      background-color: var(--accent-red);
      color: #fff;
    }

    button.success {
      background-color: var(--accent-green);
      color: #0b0f19;
    }
  </style>
</head>
<body>

  <header>
    <h1>BETA TIMER</h1>
    <div id="gpsStatus" class="status-badge">GPS OFF</div>
  </header>

  <main>
    <!-- HUD Dashboard Over Map -->
    <div class="dashboard-overlay">
      <div class="metric-card">
        <div class="metric-label">SOG</div>
        <div id="sogVal" class="metric-value">0.0 <span style="font-size:0.7rem">kn</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label">COG</div>
        <div id="cogVal" class="metric-value">--°</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Spread ($\sigma$)</div>
        <div id="spreadVal" class="metric-value">--°</div>
      </div>
    </div>

    <!-- Leaflet Map Container -->
    <div id="map"></div>
  </main>

  <div class="controls-dock">
    <div id="timerDisplay" class="timer-display">05:00</div>
    <div class="button-group">
      <button id="syncBtn">SYNC</button>
      <button id="startBtn" class="primary">START</button>
      <button id="resetBtn" class="danger">RESET</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // --- State Management ---
    let map, boatMarker, trackPath, sectorLayer;
    let trackHistory = []; // stores { lat, lon, cog, sog, timestamp }
    let watchId = null;

    // Timer state
    let timerSeconds = 300; // 5 minutes default
    let timerInterval = null;
    let timerRunning = false;

    // --- Initialization ---
    function initApp() {
      // Initialize Leaflet Map centered on Sydney Harbour
      map = L.map('map', { zoomControl: false }).setView([-33.8568, 151.2153], 14);

      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 19
      }).addTo(map);

      trackPath = L.polyline([], { color: '#00d2ff', weight: 3, opacity: 0.7 }).addTo(map);

      // Start GPS watch
      startGPS();

      // Attach UI Listeners
      document.getElementById('startBtn').addEventListener('click', toggleTimer);
      document.getElementById('syncBtn').addEventListener('click', syncTimer);
      document.getElementById('resetBtn').addEventListener('click', resetTimer);
    }

    // --- GPS Tracking ---
    function startGPS() {
      const badge = document.getElementById('gpsStatus');
      if ('geolocation' in navigator) {
        watchId = navigator.geolocation.watchPosition(
          (position) => {
            badge.textContent = "GPS LIVE";
            badge.classList.add('active');

            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const sogMs = position.coords.speed || 0;
            const sogKnots = sogMs * 1.94384; // m/s to knots
            const cog = position.coords.heading || 0;

            // Update Metrics HUD
            document.getElementById('sogVal').innerHTML = `${sogKnots.toFixed(1)} <span style="font-size:0.7rem">kn</span>`;
            document.getElementById('cogVal').textContent = `${Math.round(cog)}°`;

            const point = { lat, lon, cog, sog: sogKnots, time: Date.now() };
            trackHistory.push(point);

            // Keep track manageable
            if (trackHistory.length > 200) trackHistory.shift();

            // Update map elements
            updateMapDisplay(lat, lon, cog);
          },
          (error) => {
            badge.textContent = "GPS ERR";
            badge.classList.remove('active');
            console.warn(`Geolocation error (${error.code}): ${error.message}`);
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
        );
      } else {
        badge.textContent = "NO GPS";
      }
    }

    // --- Circular Statistics & Wedge Generation ---
    function calculateHeadingStats(bearings, scaleFactor = 1.5) {
      if (!bearings || bearings.length === 0) return { mean: 0, spread: 0 };

      let sumSin = 0;
      let sumCos = 0;

      for (let b of bearings) {
        const rad = (b * Math.PI) / 180;
        sumSin += Math.sin(rad);
        sumCos += Math.cos(rad);
      }

      const n = bearings.length;
      const meanSin = sumSin / n;
      const meanCos = sumCos / n;

      let meanRad = Math.atan2(meanSin, meanCos);
      let meanDeg = (meanRad * 180) / Math.PI;
      if (meanDeg < 0) meanDeg += 360;

      const R = Math.sqrt(meanSin * meanSin + meanCos * meanCos);
      const circStdDevRad = R > 0 ? Math.sqrt(-2 * Math.log(R)) : 0;
      const circStdDevDeg = (circStdDevRad * 180) / Math.PI;

      const halfWidth = circStdDevDeg * scaleFactor;

      return {
        mean: meanDeg,
        spread: Math.min(halfWidth, 90)
      };
    }

    function getDestinationPoint(lat, lon, bearingDeg, distanceMeters) {
      const R = 6371000;
      const δ = distanceMeters / R;
      const θ = (bearingDeg * Math.PI) / 180;

      const φ1 = (lat * Math.PI) / 180;
      const λ1 = (lon * Math.PI) / 180;

      const sinφ1 = Math.sin(φ1), cosφ1 = Math.cos(φ1);
      const sind = Math.sin(δ), cosd = Math.cos(δ);

      const sinφ2 = sinφ1 * cosd + cosφ1 * sind * Math.cos(θ);
      const φ2 = Math.asin(sinφ2);
      const y = Math.sin(θ) * sind * cosφ1;
      const x = cosd - sinφ1 * sinφ2;
      const λ2 = λ1 + Math.atan2(y, x);

      return [(φ2 * 180) / Math.PI, (λ2 * 180) / Math.PI];
    }

    function generateSectorPolygon(boatLat, boatLon, bearings, radiusMeters = 150, numArcPoints = 12) {
      const { mean, spread } = calculateHeadingStats(bearings);
      
      // Update spread metric HUD view
      document.getElementById('spreadVal').textContent = `${spread.toFixed(1)}°`;

      const startBearing = mean - spread;
      const endBearing = mean + spread;
      const step = (endBearing - startBearing) / (numArcPoints - 1);

      const polygonCoords = [[boatLat, boatLon]];

      for (let i = 0; i < numArcPoints; i++) {
        const currentBearing = startBearing + (step * i);
        const dest = getDestinationPoint(boatLat, boatLon, currentBearing, radiusMeters);
        polygonCoords.push(dest);
      }

      polygonCoords.push([boatLat, boatLon]);
      return polygonCoords;
    }

    function updateMapDisplay(lat, lon, cog) {
      const latLng = [lat, lon];
      
      // Update trail
      trackPath.setLatLngs(trackHistory.map(p => [p.lat, p.lon]));

      // Update or create Boat Marker
      if (!boatMarker) {
        boatMarker = L.circleMarker(latLng, {
          radius: 8,
          color: '#ffffff',
          weight: 2,
          fillColor: '#00d2ff',
          fillOpacity: 1
        }).addTo(map);
      } else {
        boatMarker.setLatLng(latLng);
      }

      // Generate and update Sector Cone based on recent COG measurements
      const recentBearings = trackHistory.slice(-15).map(pt => pt.cog);
      const sectorCoords = generateSectorPolygon(lat, lon, recentBearings, 150, 12);

      if (!sectorLayer) {
        sectorLayer = L.polygon(sectorCoords, {
          color: '#00d2ff',
          weight: 1,
          fillColor: '#00d2ff',
          fillOpacity: 0.2
        }).addTo(map);
      } else {
        sectorLayer.setLatLngs(sectorCoords);
      }

      // Smooth pan map to boat location
      map.panTo(latLng, { animate: true, duration: 0.5 });
    }

    // --- Regatta Timer Logic ---
    function toggleTimer() {
      const btn = document.getElementById('startBtn');
      if (!timerRunning) {
        timerRunning = true;
        btn.textContent = "PAUSE";
        btn.className = "";
        timerInterval = setInterval(() => {
          if (timerSeconds > 0) {
            timerSeconds--;
            updateTimerDisplay();
          } else {
            clearInterval(timerInterval);
            timerRunning = false;
            btn.textContent = "START";
            btn.className = "primary";
          }
        }, 1000);
      } else {
        timerRunning = false;
        btn.textContent = "START";
        btn.className = "primary";
        clearInterval(timerInterval);
      }
    }

    function syncTimer() {
      // Round up/down to nearest minute sequence typical in starting penalty sequences
      const remainder = timerSeconds % 60;
      if (remainder > 30) {
        timerSeconds += (60 - remainder);
      } else {
        timerSeconds -= remainder;
      }
      updateTimerDisplay();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerRunning = false;
      timerSeconds = 300;
      const btn = document.getElementById('startBtn');
      btn.textContent = "START";
      btn.className = "primary";
      updateTimerDisplay();
    }

    function updateTimerDisplay() {
      const mins = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
      const secs = (timerSeconds % 60).toString().padStart(2, '0');
      document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
      
      if (timerSeconds <= 60) {
        document.getElementById('timerDisplay').style.color = 'var(--accent-red)';
      } else {
        document.getElementById('timerDisplay').style.color = 'var(--text-main)';
      }
    }

    // Run Init on Load
    window.onload = initApp;
  </script>
</body>
</html>
