<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Countdown Timer</title>

    <!-- PWA / iOS Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Countdown">
    <link rel="apple-touch-icon" href="sailboat.jpg">

    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1c1c21;
            --text-color: #f4f4f6;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --secondary-btn: #374151;
            --secondary-hover: #4b5563;
            --muted-color: #9ca3af;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .live-clock {
            font-size: 0.9rem;
            color: var(--muted-color);
            margin-bottom: 12px;
            font-variant-numeric: tabular-nums;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 20px;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        /* Mode Selector Tabs */
        .mode-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            background: transparent;
            border: none;
            color: var(--muted-color);
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: white;
        }

        /* Rolling Wheel Time Picker (Duration Mode) */
        .picker-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 15px;
        }

        .wheel-column {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wheel {
            height: 120px;
            width: 80px;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            -ms-overflow-style: none;
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        .wheel::-webkit-scrollbar {
            display: none;
        }

        .wheel-item {
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--muted-color);
            scroll-snap-align: center;
            cursor: pointer;
            transition: color 0.15s;
        }

        .wheel-item.selected {
            color: var(--text-color);
        }

        .wheel-separator {
            font-size: 2rem;
            font-weight: 700;
            color: var(--muted-color);
            padding-bottom: 5px;
        }

        .wheel-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 6px;
        }

        /* Target Time Input Container */
        .target-time-container {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 15px;
        }

        input[type="time"] {
            width: 80%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-color);
            font-size: 1.5rem;
            text-align: center;
            outline: none;
            font-variant-numeric: tabular-nums;
        }

        .target-time-label {
            font-size: 0.75rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Active Countdown Display (Visible when running) */
        .active-display {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 25px 15px;
        }

        .active-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .active-value {
            font-size: 3rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: var(--text-color);
        }

        .active-separator {
            font-size: 3rem;
            font-weight: 700;
            color: var(--muted-color);
            padding-bottom: 12px;
        }

        .active-label {
            font-size: 0.7rem;
            color: var(--muted-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .message {
            font-size: 1rem;
            margin-bottom: 20px;
            color: var(--muted-color);
            min-height: 24px;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background-color: var(--accent-color);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--secondary-btn);
        }

        .btn-secondary:hover {
            background-color: var(--secondary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="live-clock" id="live-clock">Current Time: 00:00:00</div>
        <h1 id="event-title">Countdown Timer</h1>

        <!-- Mode Toggle Tabs -->
        <div class="mode-tabs" id="mode-tabs">
            <button class="tab-btn active" id="duration-tab">Duration</button>
            <button class="tab-btn" id="target-time-tab">Target Time</button>
        </div>

        <!-- Rolling Wheel Time Picker (Duration Mode) -->
        <div class="picker-container" id="picker-container">
            <div class="wheel-column">
                <div class="wheel" id="minutes-wheel"></div>
                <div class="wheel-label">Minutes</div>
            </div>
            <div class="wheel-separator">:</div>
            <div class="wheel-column">
                <div class="wheel" id="seconds-wheel"></div>
                <div class="wheel-label">Seconds</div>
            </div>
        </div>

        <!-- Target Time Input (Target Time Mode) -->
        <div class="target-time-container" id="target-time-container">
            <input type="time" id="time-input">
            <div class="target-time-label">Set Target Time (Hours : Minutes)</div>
        </div>

        <!-- Clean Active Countdown Display (Shown when running) -->
        <div class="active-display" id="active-display">
            <div class="active-box">
                <div class="active-value" id="active-mins">00</div>
                <div class="active-label">Minutes</div>
            </div>
            <div class="active-separator">:</div>
            <div class="active-box">
                <div class="active-value" id="active-secs">00</div>
                <div class="active-label">Seconds</div>
            </div>
        </div>

        <div class="message" id="message">Scroll wheels to set duration</div>

        <div class="controls">
            <button id="start-btn">Start Countdown</button>
            <button id="quick-5min-btn" class="btn-secondary">Quick 5 Min Timer</button>
        </div>
    </div>

    <script>
        const liveClockEl = document.getElementById('live-clock');
        const messageEl = document.getElementById('message');
        const modeTabs = document.getElementById('mode-tabs');
        const durationTab = document.getElementById('duration-tab');
        const targetTimeTab = document.getElementById('target-time-tab');
        const pickerContainer = document.getElementById('picker-container');
        const targetTimeContainer = document.getElementById('target-time-container');
        const timeInput = document.getElementById('time-input');
        const activeDisplay = document.getElementById('active-display');
        const activeMinsEl = document.getElementById('active-mins');
        const activeSecsEl = document.getElementById('active-secs');
        const minutesWheel = document.getElementById('minutes-wheel');
        const secondsWheel = document.getElementById('seconds-wheel');
        const startBtn = document.getElementById('start-btn');
        const quick5Btn = document.getElementById('quick-5min-btn');

        let targetTime = null;
        let isRunning = false;
        let lastSpokenSecond = -1;
        let currentMode = 'duration';
        let audioCtx = null;
        const utteranceCache = {};

        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, duration, type = 'sine', volume = 0.15) {
            try {
                initAudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function initSpeechCache() {
            if (!('speechSynthesis' in window))
